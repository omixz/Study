<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--fg:#1C2B3A;--card:#fff;--mut:#6b7785;--acc:#1C2B3A;--ok:#1e8e4e;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--fg:#eef1f4;--card:#1c2733;--mut:#93a1b0;--acc:#6fb3ff;--ok:#4cd37f;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#121a22;--fg:#eef1f4;--card:#1c2733;--mut:#93a1b0;--acc:#6fb3ff;--ok:#4cd37f;--bad:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 4px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--mut);background:none;color:var(--fg);padding:9px 14px;border-radius:99px;font-size:15px;font-family:inherit}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.go{width:100%;background:var(--acc);color:var(--bg);border:0;padding:15px;border-radius:12px;font-size:18px;font-weight:600;margin-top:12px}
textarea{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1.5px solid var(--mut);background:var(--bg);color:var(--fg);min-height:84px;font-family:inherit}
textarea.bad{border-color:var(--bad)}
.hud{display:flex;justify-content:space-between;font-size:18px;font-weight:600}
#tp{font-size:12px;color:var(--mut);margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
#q{font-size:21px;line-height:1.35;margin:6px 0 14px}
#prog{text-align:center;color:var(--mut);font-size:14px;margin-top:8px}
#last{margin-top:14px;font-size:13px;color:var(--mut);border-left:3px solid var(--bad);padding-left:10px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:1.5px solid var(--mut);background:var(--card);color:var(--fg);font-size:17px;font-family:inherit}
.ans{background:var(--card);border-radius:12px;padding:14px;margin:8px 0;font-size:16px}
.big{font-size:56px;font-weight:700;text-align:center}
.miss{padding:9px 0;border-bottom:1px solid var(--mut);font-size:14px}
.hide{display:none}
details{border:1.5px solid var(--mut);border-radius:12px;padding:0 12px}
summary{padding:12px 0;font-size:16px;cursor:pointer}
.sg{border-top:1px solid var(--mut);padding:8px 0}
.sg label,.tl{display:flex;align-items:center;gap:10px;margin:0;padding:7px 0;font-size:15px;color:var(--fg)}
.sg .h{font-weight:700}
.tl{padding-left:22px}
input[type=checkbox]{width:20px;height:20px;flex:none}

/* v2 look */
:root{--bg:#f5f6fb;--fg:#141a33;--card:#fff;--mut:#707794;--acc:#4f46e5;--acc2:#06b6d4;--ok:#16a34a;--bad:#e11d48;--line:#e3e6f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#eef0fb;--card:#151b30;--mut:#8f97b8;--acc:#818cf8;--acc2:#22d3ee;--ok:#4ade80;--bad:#fb7185;--line:#262e4d}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#eef0fb;--card:#151b30;--mut:#8f97b8;--acc:#818cf8;--acc2:#22d3ee;--ok:#4ade80;--bad:#fb7185;--line:#262e4d}
body{background:var(--bg)}
main{padding:28px 18px 96px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.card{border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(20,26,51,.06)}
label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:600}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
#modes .chip{flex:1;text-align:center;padding:12px 6px}
details{border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.sg{border-color:var(--line)}
.go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:16px;padding:17px;box-shadow:0 10px 24px rgba(79,70,229,.3)}
#start{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#bar{height:6px;border-radius:9px;background:var(--line);margin:10px 0 4px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1s linear}
.hud{font-variant-numeric:tabular-nums;font-size:20px}
#s{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 14px;color:var(--acc)}
#qwrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}
#tp{margin:0 0 8px;color:var(--acc);font-weight:700}
#q{font-size:22px;font-weight:600;margin:0}
textarea{border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:17px}
textarea:focus{outline:none;border-color:var(--acc)}
.opt{border:1px solid var(--line);border-radius:14px;font-weight:500}
.opt:active{border-color:var(--acc)}
.ans{border:1px solid var(--line);border-radius:14px}
#last{border-left-color:var(--ok);background:var(--card);border-radius:0 12px 12px 0;padding:10px 12px}
.big{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:72px}
.tr{display:flex;gap:10px;align-items:stretch}.tr textarea{flex:1;min-width:0}.side{width:84px;flex:none;font-weight:700;color:var(--acc)}
.tr input{flex:1;min-width:0;font-size:18px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font-family:inherit}.tr input:focus{outline:none;border-color:var(--acc)}
</style></head><body><main>
<div id="menu">
  <h1>HSC Fast Fire</h1>
  <div class="mut">Beat the clock. Learn it by firing it.</div>
  <div class="card">
    <label>Subjects &amp; topics</label><div class="row" id="subs"></div>
    <label>Mode</label><div class="row" id="modes"></div>
    <div class="mut" id="mdesc" style="margin-top:8px"></div>
    <label>Total time</label><div class="row" id="times"></div>
    <label>Per-question limit (auto-skips)</label><div class="row" id="pq"></div>
    <button class="go" id="start">Start</button>
  </div>
</div>
<div id="game" class="hide">
  <div class="hud"><span id="t">120</span><span id="qt" class="mut"></span><span id="s">0</span></div>
  <div id="bar"><i></i></div>
  <div id="qwrap"><div id="tp"></div><div id="q"></div></div>
  <div id="body"></div>
  <div id="last" class="hide"></div>
  <button class="chip" id="skip" style="margin-top:16px">Skip</button>
</div>
<div id="end" class="hide">
  <div class="card"><div class="mut" style="text-align:center">Score</div><div class="big" id="fs">0</div>
  <div class="mut" style="text-align:center" id="fd"></div></div>
  <div class="card"><b>Missed / skipped</b><div id="ml"></div></div>
  <button class="go" id="again">Play again</button>
  <button class="go" id="home" style="background:none;color:var(--fg);border:1.5px solid var(--mut)">Menu</button>
</div>
</main>
<script>
const D={"CAFS": {"c": [["Parenting and Caring", "List the four styles of parenting or caring studied in CAFS.", "Authoritarian, democratic, permissive/indulgent and negligent."], ["Parenting and Caring", "Name two ways a person can become a social parent.", "Any two of: adoption, fostering, step-parenting, surrogacy."], ["Parenting and Caring", "What are the three core roles of a parent or carer?", "Satisfying the specific needs of the dependant, building a positive relationship with the dependant, and promoting the dependant's wellbeing."], ["Parenting and Caring", "What is 'duty of care'?", "The legal and moral responsibility of a parent or carer to protect a dependant from harm."], ["Research Methodology", "What is 'validity' in research?", "The extent to which a research method actually measures what it claims to measure."], ["Research Methodology", "Define 'reliability' in research.", "The extent to which research produces consistent results if repeated under the same conditions."], ["Research Methodology", "What three parts make up the Independent Research Project (IRP)?", "The project plan, the project diary and the product."], ["Research Methodology", "What is the difference between qualitative and quantitative data?", "Qualitative data is descriptive, non-numerical information (eg opinions); quantitative data is numerical information that can be measured or counted."], ["Research Methodology", "What is a key ethical consideration when research involves human participants?", "Informed consent - participants must be fully informed about the research and voluntarily agree to participate."], ["Groups in Context", "Which two community groups are mandatory (Category A) for study in Groups in Context?", "Youth, and Rural and remote families."], ["Groups in Context", "List three Category B groups students can choose from in Groups in Context.", "Any three of: the Aged, Culturally and Linguistically Diverse communities, Aboriginal and Torres Strait Islander peoples, People with disabilities, LGBTQIA+ communities, Sole parents, Homeless people."], ["Groups in Context", "Name three types of services relevant to community groups.", "Any three of: financial support, transport, accommodation and housing, health care, counselling, education, employment, legal aid."], ["Groups in Context", "What is 'equity' in relation to community groups?", "Fair and equal access to opportunities, resources and services regardless of a person's background or circumstances."], ["Social Impact of Technology", "Give an example of technology as 'hardware' and as 'software'.", "Hardware: appliances, gadgets or toys. Software: applications, databases or websites."], ["Social Impact of Technology", "Name three factors that affect a person's access to and acceptance of technology.", "Any three of: age, culture, education, economic status, disability, geographical location, gender."], ["Social Impact of Technology", "Name two issues related to information and communication technology.", "Any two of: privacy and safety, security of information, accuracy of information, information overload, copyright."], ["Social Impact of Technology", "What is 'leading edge' technology?", "The most advanced technology currently available, offering a competitive advantage but often costly and higher risk."], ["Research Methodology", "What is the difference between a primary and a secondary source of data?", "A primary source is data collected firsthand by the researcher (e.g. a survey they conducted); a secondary source is existing data collected by someone else (e.g. government statistics, published studies)."], ["Research Methodology", "Name three sampling methods used in research.", "Any three of: random sampling, convenience sampling, stratified sampling, snowball sampling, systematic sampling."], ["Research Methodology", "How does sample size affect research findings?", "A larger sample size generally increases the reliability and generalisability of findings, while a small sample size increases the risk that results don't represent the wider population."], ["Research Methodology", "Give a strength and a limitation of using a questionnaire as a research method.", "Strength: can reach a large number of people quickly and cheaply. Limitation: relies on honest self-reporting and may have low response rates."], ["Research Methodology", "Give a strength and a limitation of using an interview as a research method.", "Strength: allows for in-depth, detailed responses and follow-up questions. Limitation: time-consuming, and interviewer presence may influence answers (interviewer bias)."], ["Research Methodology", "What are the stages of the research process, in order?", "Identify a topic/research question, review existing literature, choose a research method, collect data, analyse data, draw conclusions, and present/evaluate findings."], ["Research Methodology", "What is 'researcher bias'?", "When a researcher's own beliefs or expectations unintentionally influence how they design a study, collect data, or interpret results."], ["Research Methodology", "Why is informed consent important in research involving people?", "It ensures participants understand the purpose, risks and their rights (including withdrawing at any time) before agreeing to take part, protecting their autonomy and wellbeing."], ["Research Methodology", "What is the difference between confidentiality and anonymity in research?", "Confidentiality means the researcher knows participants' identities but keeps them private; anonymity means even the researcher cannot identify individual participants."], ["Research Methodology", "What is a pilot study and why is it useful?", "A small-scale trial run of a research method before the full study, used to identify and fix problems with the method (e.g. confusing survey questions) before collecting real data."], ["Research Methodology", "What is the difference between correlation and causation?", "Correlation means two variables are related or change together; causation means one variable directly causes a change in the other. Correlation does not prove causation."], ["Research Methodology", "What is the difference between a cross-sectional and a longitudinal study?", "A cross-sectional study collects data from different people at one point in time; a longitudinal study follows the same participants over an extended period."], ["Research Methodology", "What is 'triangulation' in research?", "Using multiple research methods or data sources to study the same question, increasing the validity of findings by cross-checking results."], ["Groups in Context", "What does 'prevalence' mean when studying a specific community group?", "How common or widespread that group is within the population - e.g. the proportion of the population that falls into the Youth or Rural and remote families category."], ["Groups in Context", "List the specific needs categories used to analyse a community group.", "Health, education, safety/protection, identity and self-esteem, and standard of living."], ["Groups in Context", "What barriers commonly affect a group's access to services?", "Cost, location/distance, lack of awareness of available services, discrimination, and cultural or language barriers."], ["Groups in Context", "How can government policy and legislation address equity issues for a community group?", "Through targeted funding, anti-discrimination laws, and specific programs designed to address that group's particular needs and barriers to services."], ["Groups in Context", "What role can community organisations play for a specific group?", "Providing direct support and services, advocating for policy change, and raising public awareness to influence attitudes toward the group."], ["Groups in Context", "What specific issues commonly affect the Youth category group?", "Any of: unemployment, mental health, access to affordable housing/homelessness, education transitions, and navigating independence."], ["Groups in Context", "What specific issues commonly affect Rural and remote families?", "Any of: geographic isolation, limited access to health and education services, drought and economic hardship, and higher costs of essential services."], ["Groups in Context", "What is 'marginalisation' in the context of community groups?", "The process by which a group is pushed to the edges of society and denied full access to resources, services or participation, often due to discrimination or systemic barriers."], ["Groups in Context", "How can media representation affect public attitudes toward a community group?", "Media coverage can reinforce stereotypes and stigma, or challenge them and build empathy and understanding, depending on how a group is portrayed."], ["Parenting and Caring", "What is the difference between a biological parent and a social parent?", "A biological parent has a genetic connection to the dependant; a social parent has a parenting role without that genetic link, such as through adoption, fostering, step-parenting or surrogacy."], ["Parenting and Caring", "What is a 'carer'?", "A person who provides ongoing support and assistance to a dependant (such as a child, an aged person, or someone with a disability) without necessarily being their parent."], ["Parenting and Caring", "Name two legal responsibilities parents have toward their children.", "Any two of: providing for their education, ensuring their safety and welfare, providing financial maintenance, and making decisions in the child's best interests."], ["Parenting and Caring", "List three factors that affect the parenting or caring role.", "Any three of: age of the parent/carer, number of dependants, socioeconomic status, availability of support networks, and cultural background."], ["Parenting and Caring", "What is the difference between formal and informal support for parents and carers?", "Formal support comes from government or organised services (e.g. childcare subsidies, parenting programs, respite care); informal support comes from family, friends and community networks."], ["Parenting and Caring", "What is 'attachment' in the context of parenting?", "The emotional bond that develops between a dependant and their parent or carer, which is considered important for healthy social and emotional development."], ["Parenting and Caring", "How might an authoritarian parenting style affect a child, compared to a democratic style?", "Authoritarian (strict, low warmth) can lead to obedience but lower self-esteem and independence; democratic (high expectations with warmth and negotiation) is generally linked to better self-esteem and social skills."], ["Parenting and Caring", "What is the key difference between fostering and adoption?", "Fostering is typically a temporary arrangement where legal guardianship may remain with the birth parents or the state; adoption is a permanent, legal transfer of parental rights and responsibilities."], ["Social Impact of Technology", "What is the 'Digital Revolution'?", "The shift from mechanical and analogue technology to digital technology, beginning in the latter half of the 20th century, which transformed how information is created, stored and shared."], ["Social Impact of Technology", "What is the 'digital divide'?", "The gap between people who have ready access to digital technology and the internet, and those who do not, often due to cost, location or age."], ["Social Impact of Technology", "How can technology positively and negatively affect family relationships?", "Positively, it can help families stay connected across distance (video calls); negatively, it can reduce face-to-face interaction and create conflict over screen time use."], ["Social Impact of Technology", "How has technology changed the workplace?", "Through automation of routine tasks, the rise of telecommuting/remote work, and the need for new digital skills, while also displacing some traditional jobs."], ["Social Impact of Technology", "What privacy issues are associated with technology use?", "Personal data being collected, stored or shared without full user awareness or consent, and the risk of that data being misused or exposed."], ["Social Impact of Technology", "What is 'cybercrime'?", "Criminal activity carried out using computers or the internet, such as hacking, identity theft, scams and data breaches."], ["Social Impact of Technology", "What is 'cyberbullying'?", "The use of digital technology (social media, messaging, etc.) to deliberately and repeatedly harass, threaten or humiliate another person."], ["Social Impact of Technology", "What is 'digital literacy'?", "The ability to effectively and safely find, evaluate, use and create information using digital technology."], ["Social Impact of Technology", "How can technology impact community wellbeing both positively and negatively?", "Positively, by connecting people with shared interests and support networks online; negatively, by reducing in-person social interaction and potentially increasing feelings of isolation."], ["Research Methodology", "What is a 'hypothesis' in research?", "A testable prediction or educated guess about the relationship between variables, formed before data collection begins."], ["Research Methodology", "What is 'secondary data analysis'?", "Analysing data that was originally collected by someone else for a different purpose, such as government census data or previously published studies."], ["Groups in Context", "What is meant by a group's 'standard of living'?", "The level of wealth, comfort, material goods and access to services available to a group, often used as an indicator of overall quality of life."], ["Groups in Context", "How can identity and self-esteem needs differ for the Youth group compared to Rural and remote families?", "Youth often need support navigating identity formation and independence during adolescence; rural and remote families may need identity support tied to isolation, community connection, and maintaining cultural or generational farming/community ties."], ["Parenting and Caring", "What is 'respite care'?", "Temporary care provided to give a primary carer a break from their caring responsibilities, which can be formal (organised services) or informal (family/friends stepping in)."], ["Parenting and Caring", "What legal document outlines parental responsibility in Australia if parents separate?", "A parenting plan or parenting order made under the Family Law Act 1975 (Cth), which sets out arrangements for a child's care, living arrangements and decision-making."], ["Social Impact of Technology", "What is 'planned obsolescence'?", "A business strategy where products are deliberately designed to become outdated or non-functional after a certain period, encouraging consumers to buy replacements - contributing to e-waste."], ["Social Impact of Technology", "What is 'assistive technology' and give an example.", "Technology designed to help people with disabilities complete tasks more independently - examples include screen readers, hearing aids, and voice-activated devices."], ["Groups in Context", "What is the difference between Category A and Category B community groups in CAFS?", "Category A groups (Youth, and Rural and remote families) are mandatory - all students study both. Category B groups (e.g. aged persons, people with disability, LGBTIQ people, veterans, overseas visitors, people from diverse cultural/language backgrounds) are optional - students study 2 of these."], ["Groups in Context", "Name three groups a student could choose from Category B.", "Any three of: aged persons, people with a disability, LGBTIQ people, veterans and defence force families, overseas visitors, people from culturally and linguistically diverse backgrounds, women, people affected by addiction, community services workers."], ["Parenting and Caring", "What is 'duty of care' in the context of parenting?", "A legal obligation on a parent or carer to take reasonable steps to protect a dependant from foreseeable harm."], ["Parenting and Caring", "What does 'in loco parentis' mean?", "Latin for 'in place of a parent' - describes a person or institution (e.g. a school, temporarily) taking on parental responsibilities and duty of care for a child."], ["Social Impact of Technology", "What is the difference between a 'leading edge' and 'trailing edge' adopter of technology?", "A leading edge adopter takes up new technology early, often at higher cost and risk; a trailing edge adopter waits until technology is well-established, cheaper and more reliable before adopting it."], ["Social Impact of Technology", "What is 'technological convergence'?", "The combining of multiple previously separate technologies or functions into a single device - e.g. a smartphone combining a phone, camera, GPS and internet browser."], ["Command Words", "What does 'identify' mean as an exam command word?", "Recognise and name something clearly - one of the simplest, lowest-mark command words."], ["Command Words", "What does 'describe' mean as an exam command word?", "State the features or characteristics of something, without needing to explain why."], ["Command Words", "What does 'outline' mean as an exam command word?", "Give a brief summary of the main points, without going into full detail."], ["Command Words", "What does 'explain' mean as an exam command word?", "Show cause and effect - make clear why or how something happens, not just what it is."], ["Command Words", "What does 'analyse' mean as an exam command word?", "Break something into its parts, identify how those parts relate to each other, and draw out what this means."], ["Command Words", "What does 'discuss' mean as an exam command word?", "Explore an issue by presenting points for and/or against it."], ["Command Words", "What does 'assess' mean as an exam command word?", "Make a judgement about the value, quality, outcome or importance of something."], ["Command Words", "What does 'evaluate' mean as an exam command word?", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of something."], ["Command Words", "What does 'justify' mean as an exam command word?", "Support an argument or conclusion with reasons and evidence."], ["Command Words", "What does 'compare' mean as an exam command word?", "Show how two or more things are similar."], ["Command Words", "What does 'contrast' mean as an exam command word?", "Show how two or more things are different."], ["Command Words", "What does 'distinguish' mean as an exam command word?", "Identify and explain the differences between two things that might otherwise seem similar."], ["Command Words", "What does 'examine' mean as an exam command word?", "Inquire into something closely and in detail to understand it fully."], ["Command Words", "What does 'define' mean as an exam command word?", "State the precise meaning of a term and identify its essential features."], ["Command Words", "What does 'interpret' mean as an exam command word?", "Draw meaning from information, data or a source rather than just describing it."], ["Command Words", "What does 'account for' mean as an exam command word?", "State reasons for something, or report on why or how it happened."], ["Command Words", "What does 'apply' mean as an exam command word?", "Use knowledge, a formula or a method in a specific situation or scenario."], ["Command Words", "What does 'investigate' mean as an exam command word?", "Plan, inquire into and draw conclusions about a topic."], ["Command Words", "What does 'propose' mean as an exam command word?", "Put forward an idea, argument or suggestion for consideration."], ["Command Words", "What does 'predict' mean as an exam command word?", "Suggest a likely outcome based on the information available."], ["Command Words", "What does adding 'critically' before 'analyse' or 'evaluate' change?", "It asks for an extra degree of depth, rigour, questioning and reflection beyond a standard analyse/evaluate response."], ["Command Words", "Why does it matter which command word an HSC question uses?", "Command words indicate exactly what kind of response is expected and roughly how many marks are available - lower-order words (identify, outline) are usually worth fewer marks than higher-order words (analyse, evaluate), so answering with the wrong depth costs marks even with correct content."], ["Command Words", "What is the general hierarchy of command words from lowest to highest order?", "Roughly: identify/outline -> describe -> explain -> analyse/discuss -> assess/evaluate -> critically analyse/evaluate, with depth and mark value increasing up the hierarchy."], ["Parenting and Caring", "What does the acronym FASS stand for (types of social parents)?", "Fostering, Adoption, Step-parenting, Surrogacy - the four types of social parents (a parent without a genetic connection to the dependant)."], ["Parenting and Caring", "What does the acronym COME stand for (preparations for becoming a parent/carer)?", "Changing health behaviours (nutrition, physical activity, social/spiritual connections), Organising finances (budgeting, saving, support payments), Modifying the physical environment (housing, amenities, equipment), Enhancing knowledge and skills (education, information, training)."], ["Parenting and Caring", "What does the acronym PBS stand for (roles of parents/carers)?", "Promoting the wellbeing of the dependant, Building a positive relationship with the dependant, Satisfying the specific needs of the dependant."], ["Parenting and Caring", "What does the acronym CHEF RC stand for (services provided through formal support)?", "Childcare, Health care, Education, Financial support, Respite care, Counselling."], ["Parenting and Caring", "What does the acronym CROPMESS stand for (personal influences on parenting/caring)?", "Culture/customs/tradition, Religion/spirituality, Own upbringing, Previous experience, Multiple commitments (e.g. work, study, sport), Education, Socioeconomic status, Special needs."], ["Parenting and Caring", "What does the acronym CGM (sometimes MCG) stand for (social influences on parenting/caring)?", "Community attitudes, Gender expectations, Media stereotypes."], ["Parenting and Caring", "What does the acronym DSD stand for (responsibilities of parents/carers)?", "Duty of care, Setting limits, Discipline."], ["Parenting and Caring", "What does the acronym PAND stand for (styles of parenting)?", "Permissive/Indulgent, Authoritarian, Negligent, Democratic - the four recognised styles of parenting."], ["Research Methodology", "What is a 'case study' as a research method, and its main limitation?", "An in-depth investigation of one individual, group or event. It provides rich, detailed insight but findings can't be generalised to a wider population."], ["Research Methodology", "What is 'observation' as a research method, and a key limitation?", "Watching and recording behaviour as it naturally occurs. Useful for real behaviour rather than self-reported behaviour, but participants may act differently if they know they're being watched (observer effect)."], ["Research Methodology", "What is a 'focus group'?", "A small group of people brought together to discuss a topic, guided by a facilitator - generates rich qualitative data and diverse viewpoints, but can be dominated by strong personalities."], ["Research Methodology", "What is the purpose of a literature review in the research process?", "Reviewing existing research/sources on the topic before starting, to identify what's already known, avoid duplicating work, and refine the research question."], ["Research Methodology", "What does 'data analysis' involve, as distinct from data collection?", "Organising, summarising and interpreting the raw data gathered, to identify patterns and draw conclusions - collection is gathering the data, analysis is making sense of it."], ["Research Methodology", "Why is a bibliography/referencing important in research, and what does plagiarism mean?", "Referencing acknowledges the sources used, allows others to verify claims, and avoids plagiarism - presenting someone else's work or ideas as your own without acknowledgement."], ["Research Methodology", "What is the difference between random and non-random (e.g. convenience or purposive) sampling?", "Random sampling gives every person in the population an equal chance of selection, reducing bias. Non-random sampling selects participants based on convenience or specific criteria, which is faster but more prone to bias."], ["Research Methodology", "How are results commonly presented in CAFS research?", "Tables, graphs (bar, line, pie) and statistics - chosen to clearly and accurately represent the data collected, making patterns easy for a reader to interpret."], ["Groups in Context", "What does 'stereotyping' mean in relation to a community group, and how can it affect them?", "Holding an oversimplified, generalised belief about all members of a group - can lead to discrimination, reduced self-esteem, and unfair treatment or exclusion from services."], ["Groups in Context", "What is meant by a group's 'access to services' being inequitable?", "Some groups face greater barriers than others in reaching or using services (e.g. due to cost, location, discrimination or lack of awareness), meaning resources aren't distributed fairly relative to need."], ["Groups in Context", "Name the categories commonly used to analyse a group's specific needs.", "Identity and self-esteem, security and shelter, affection, participation and protection, plus economic, social/emotional, physical and spiritual needs."], ["Groups in Context", "What role can advocacy groups play for a community group?", "Advocacy groups represent and promote the interests of a community group, lobbying government and raising public awareness to improve services, policy and social attitudes."], ["Groups in Context", "How might legislation reduce discrimination against a community group?", "Anti-discrimination laws (e.g. the Disability Discrimination Act) make it illegal to treat a person unfairly based on group membership, providing legal avenues for complaint and redress."], ["Research Methodology", "What is the 'right to withdraw' as an ethical research principle?", "Participants must be free to leave a study at any point without penalty, even after agreeing to take part - protecting their autonomy throughout the research."], ["Research Methodology", "What is 'debriefing' in research ethics?", "Informing participants, after the study, about its true purpose and results (especially important if any information was withheld during the study) and addressing any concerns they raise."], ["Research Methodology", "What is a research proposal, and what does it typically outline?", "A planning document written before research begins, outlining the aim/hypothesis, proposed methodology, timeline and ethical considerations - used to plan and justify the research approach."], ["Groups in Context", "How can socioeconomic status affect a community group's wellbeing and access to services?", "Lower income can limit access to healthcare, education, housing and other services, compounding disadvantage - while higher socioeconomic status generally provides more choice and security."], ["Parenting and Caring", "What is 'shared parenting' (co-parenting) after separation?", "An arrangement where both parents remain actively involved in raising their child after separating/divorcing, sharing decision-making and care responsibilities, guided by the child's best interests."], ["Parenting and Caring", "What role does the Family Court play in parenting and caring?", "Resolves disputes about parenting arrangements, property and child support when separating parents can't agree, making decisions based on the best interests of the child."], ["Social Impact of Technology", "What is 'e-health' (telehealth), and how has it changed access to healthcare?", "Using technology (video calls, apps, remote monitoring) to deliver healthcare services - increases access for people in rural/remote areas or with mobility issues, though it can't replace all in-person care."], ["Social Impact of Technology", "How has technology changed education (e-learning)?", "Online learning platforms, video lectures and digital resources allow flexible, remote access to education - but can widen the digital divide for students without reliable internet/devices."], ["Social Impact of Technology", "What is 'surveillance' as a technology-related issue?", "The use of technology (CCTV, tracking, data collection) to monitor individuals' behaviour - raises concerns about privacy and consent, even as it's often used for safety/security purposes."], ["Social Impact of Technology", "What are the three categories technology can be classified into?", "Hardware (physical devices, e.g. appliances, gadgets), software (programs/applications, e.g. apps, websites, databases), and organisation of knowledge (e.g. communications systems, media, the internet)."], ["Social Impact of Technology", "What is the 'Information Age'?", "The current era, following the Digital Revolution, characterised by the rapid, widespread availability of digital information and communication technology as a central part of economic and social life."], ["Social Impact of Technology", "Name the main reasons technology is developed.", "To improve upon existing technology, for economic benefit, in response to consumer demand and human needs, for social betterment, to serve the global community, and as a response to social problems."], ["Social Impact of Technology", "List the eight factors affecting a person's access to and acceptance of technology.", "Age, ethnicity/culture, education, socioeconomic status, disability, geographic location, gender, and religion."], ["Social Impact of Technology", "Name the areas commonly used to analyse the impact of an emerging technology.", "Ethics, equity and access, health and safety, economic impact, environmental impact, and education/learning."], ["Social Impact of Technology", "What three questions must the mandatory case study of a selected piece of technology address?", "How has the technology emerged or developed over time? What impact has it had politically, economically and socially? What issues are related to its use and development?"], ["Social Impact of Technology", "How might economic status affect a person's access to a piece of technology (as required in the case study)?", "Lower-income individuals/families may be unable to afford the technology itself, ongoing costs (e.g. data, subscriptions), or necessary upgrades - widening the gap between those who benefit from the technology and those who don't."], ["Social Impact of Technology", "How might disability affect a person's access to and acceptance of technology?", "Technology not designed with accessibility in mind (e.g. no screen-reader compatibility, complex interfaces) can exclude people with disabilities, while assistive technology can conversely increase their independence and participation."]], "m": [["Parenting and Caring", "Which is a parenting style studied in CAFS?", ["Authoritarian", "Passive-aggressive", "Transformational", "Autocratic"], 0, "Authoritarian is one of the four parenting/caring styles studied."], ["Parenting and Caring", "Name a way a person can become a social parent.", ["Fostering", "Genetics", "Marriage only", "Citizenship"], 0, "Fostering, adoption, step-parenting and surrogacy all create social parents."], ["Parenting and Caring", "Name a core role of a parent or carer.", ["Promoting the dependant's wellbeing", "Managing government policy", "Running a business", "Conducting research"], 0, "This is one of the three core roles in the syllabus."], ["Research Methodology", "What does 'validity' measure in research?", ["Whether a method measures what it claims to", "How large a sample is", "How long a study takes", "How ethical a study is"], 0, "Validity is about accuracy of measurement, not sample size or duration."], ["Research Methodology", "What does 'reliability' measure in research?", ["Consistency of results if repeated", "Accuracy of measurement", "Sample size", "Cost of research"], 0, "Reliable research gives the same results under the same conditions."], ["Research Methodology", "What are the three parts of the IRP?", ["Project plan, diary and product", "Survey, interview and case study", "Introduction, body and conclusion", "Data, analysis and bibliography"], 0, "The Independent Research Project has these three compulsory components."], ["Groups in Context", "Which two groups are mandatory (Category A)?", ["Youth, and rural and remote families", "The aged and homeless people", "LGBTQIA+ communities and sole parents", "People with disabilities and CALD communities"], 0, "All students must study Youth and Rural/remote families."], ["Groups in Context", "Name a Category B group option.", ["Culturally and Linguistically Diverse communities", "Youth", "Rural and remote families", "None of these"], 0, "CALD communities is one of several Category B choices."], ["Groups in Context", "Name a service type relevant to community groups.", ["Health care", "Weather forecasting", "Space exploration", "Traffic control"], 0, "Health care is one of the key service categories studied."], ["Social Impact of Technology", "Which is an example of 'software'?", ["A mobile banking app", "A smartphone device", "A washing machine", "A pair of headphones"], 0, "Software is programs and applications; the others are physical hardware."], ["Social Impact of Technology", "Name a factor affecting access to technology.", ["Geographical location", "Favourite colour", "Shoe size", "Height"], 0, "Location affects internet access and infrastructure availability."], ["Social Impact of Technology", "Name an issue linked to ICT.", ["Privacy and safety", "Physical fitness", "Traffic congestion", "Weather patterns"], 0, "Privacy and data security are core ICT issues in the syllabus."], ["Research Methodology", "What does 'reliability' in research refer to?", null, null, null], ["Groups in Context", "What is 'marginalisation'?", null, null, null], ["Parenting and Caring", "Which best describes 'social parents'?", null, null, null], ["Social Impact of Technology", "What is the 'digital divide'?", null, null, null]], "t": [["Parenting and Caring", "The legal and moral responsibility of a parent or carer to protect a dependant from harm.", "duty of care", ["duty of care"]], ["Research Methodology", "When a researcher's own beliefs or expectations unintentionally influence how they design a study.", "researcher bias", ["researcher bias"]], ["Groups in Context", "How common or widespread that group is within the population - e.g.", "prevalence", ["prevalence"]], ["Parenting and Caring", "A person who provides ongoing support and assistance to a dependant without necessarily being their parent.", "carer / caregiver / care giver", ["carer", "caregiver", "care giver", "caretaker"]], ["Social Impact of Technology", "The shift from mechanical and analogue technology to digital technology.", "Digital Revolution", ["Digital Revolution"]], ["Social Impact of Technology", "The gap between people who have ready access to digital technology and the internet, and those who do not.", "digital divide", ["digital divide"]], ["Social Impact of Technology", "Criminal activity carried out using computers or the internet.", "cybercrime", ["cybercrime"]], ["Social Impact of Technology", "The use of digital technology to deliberately and repeatedly harass, threaten or humiliate another person.", "cyberbullying", ["cyberbullying"]], ["Social Impact of Technology", "The ability to effectively and safely find, evaluate, use and create information using digital technology.", "digital literacy", ["digital literacy"]], ["Research Methodology", "Analysing data that was originally collected by someone else for a different purpose.", "secondary data analysis", ["secondary data analysis"]], ["Parenting and Caring", "Temporary care provided to give a primary carer a break from their caring responsibilities.", "respite care", ["respite care"]], ["Social Impact of Technology", "A business strategy where products are deliberately designed to become outdated or non-functional after a.", "planned obsolescence", ["planned obsolescence"]], ["Parenting and Caring", "Latin for 'in place of a parent' - describes a person or institution taking on parental responsibilities and.", "in loco parentis", ["in loco parentis"]], ["Social Impact of Technology", "The combining of multiple previously separate technologies or functions into a single device - e.g.", "technological convergence", ["technological convergence"]], ["Command Words", "Recognise and name something clearly - one of the simplest, lowest-mark command words.", "identify", ["identify"]], ["Command Words", "State the features or characteristics of something, without needing to explain why.", "describe", ["describe"]], ["Command Words", "Give a brief summary of the main points, without going into full detail.", "outline", ["outline"]], ["Command Words", "Show cause and effect - make clear why or how something happens, not just what it is.", "explain", ["explain"]], ["Command Words", "Break something into its parts, identify how those parts relate to each other, and draw out what this means.", "analyse", ["analyse"]], ["Command Words", "Explore an issue by presenting points for and/or against it.", "discuss", ["discuss"]], ["Command Words", "Make a judgement about the value, quality, outcome or importance of something.", "assess", ["assess"]], ["Command Words", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of.", "evaluate", ["evaluate"]], ["Command Words", "Support an argument or conclusion with reasons and evidence.", "justify", ["justify"]], ["Command Words", "Show how two or more things are similar.", "compare", ["compare"]], ["Command Words", "Show how two or more things are different.", "contrast", ["contrast"]], ["Command Words", "Identify and explain the differences between two things that might otherwise seem similar.", "distinguish", ["distinguish"]], ["Command Words", "Inquire into something closely and in detail to understand it fully.", "examine", ["examine"]], ["Command Words", "State the precise meaning of a term and identify its essential features.", "define", ["define"]], ["Command Words", "Draw meaning from information, data or a source rather than just describing it.", "interpret", ["interpret"]], ["Command Words", "State reasons for something, or report on why or how it happened.", "account for", ["account for"]], ["Command Words", "Use knowledge, a formula or a method in a specific situation or scenario.", "apply", ["apply"]], ["Command Words", "Plan, inquire into and draw conclusions about a topic.", "investigate", ["investigate"]], ["Command Words", "Put forward an idea, argument or suggestion for consideration.", "propose", ["propose"]], ["Command Words", "Suggest a likely outcome based on the information available.", "predict", ["predict"]], ["Research Methodology", "A small group of people brought together to discuss a topic.", "focus group", ["focus group"]], ["Groups in Context", "Holding an oversimplified, generalised belief about all members of a group - can lead to discrimination.", "stereotyping", ["stereotyping"]], ["Social Impact of Technology", "The current era, following the Digital Revolution, characterised by the rapid.", "Information Age", ["Information Age"]]]}, "Business Studies": {"c": [["Operations", "What is 'outsourcing' and give one advantage and one disadvantage.", "Outsourcing is contracting an external provider to carry out a business function. Advantage: can reduce costs and let the business focus on core activities. Disadvantage: can reduce quality control and create dependence on the external provider."], ["Operations", "Define 'economies of scale'.", "The cost advantages a business gains as output increases, due to the inverse relationship between quantity produced and per-unit fixed cost."], ["Operations", "Name two inventory management strategies.", "Just-in-time (JIT) and first-in-first-out (FIFO)."], ["Operations", "Distinguish quality control from quality assurance.", "Quality control checks finished outputs against a standard after production; quality assurance builds quality checks into the production process itself to prevent defects."], ["Operations", "What are 'transformed resources' in the operations process?", "The materials, information or customers that are acted upon and converted into outputs during the transformation process."], ["Operations", "What is 'lean production'?", "A management approach focused on minimising waste while maximising productivity."], ["Operations", "What does 'globalisation' mean for business operations?", "The increasing integration and interdependence of economies worldwide, allowing businesses to source, produce and sell across borders."], ["Operations", "What is the goal of operations management?", "To efficiently and effectively manage the resources and processes used to produce goods and services."], ["Operations", "What is meant by 'quality of design'?", "The extent to which the specifications of a good or service meet the needs and wants of the customer."], ["Operations", "What is meant by 'quality of conformance'?", "The extent to which a good or service meets the design specifications set for it."], ["Operations", "What are the four production performance objectives?", "Quality, speed, dependability and flexibility."], ["Operations", "What is 'cost leadership' as an operations strategy?", "Aiming to be the lowest-cost producer in an industry, often through economies of scale and efficient processes."], ["Operations", "What is 'differentiation' as an operations strategy?", "Making a good or service distinct from competitors through features, quality or branding, allowing a premium price."], ["Operations", "What is 'materials requirement planning' (MRP)?", "A computer-based system that calculates and orders the materials needed for production based on forecast demand."], ["Operations", "What is 'job production'?", "Producing a single, customised product to a customer's specific order, e.g. a wedding cake or custom furniture."], ["Operations", "What is 'batch production'?", "Producing a group of identical items together before moving on to a different batch, e.g. a bakery's bread runs."], ["Operations", "What is 'flow production'?", "Continuous, standardised production of identical products on an assembly line, e.g. car manufacturing."], ["Operations", "What does 'total quality management' (TQM) involve?", "A whole-of-business commitment to continuous improvement in quality, involving every employee and process."], ["Operations", "What is 'benchmarking' in operations?", "Comparing a business's processes and performance against the best practice of competitors or industry leaders."], ["Operations", "What is 'supply chain management'?", "Coordinating and integrating the flow of materials, information and finances from suppliers through to the customer."], ["Operations", "What is 'waste minimisation' in operations?", "Strategies to reduce the amount of raw materials, energy or time wasted during production."], ["Operations", "What are 'facilities' in operations?", "The physical resources used in production, such as buildings, equipment, layout and location."], ["Operations", "Why is 'location' an important operations decision?", "It affects transport costs, access to markets and suppliers, and the availability of labour."], ["Operations", "What is 'overcoming resistance to change' in operations?", "Strategies such as communication and training used to help employees accept new operations processes."], ["Operations", "Give an example of a government policy influencing operations.", "Environmental regulations, work health and safety laws, or industry-specific standards a business must comply with."], ["Operations", "What is meant by 'corporate social responsibility' in operations?", "Operating in a way that considers the social and environmental impact of production, not just profit."], ["Operations", "What is 'six sigma'?", "A data-driven quality management technique aiming to reduce defects to near zero by identifying and removing causes of errors."], ["Operations", "What is the 'transformation process'?", "The conversion of inputs (transformed and transforming resources) into outputs (goods and services)."], ["Operations", "What is a 'transforming resource'?", "A resource that acts upon other resources during production, such as human resources and facilities."], ["Marketing", "What are the four Ps of the marketing mix?", "Product, Price, Place, and Promotion."], ["Marketing", "Define 'price skimming'.", "A pricing strategy of setting a high initial price for a new product to maximise revenue from early adopters before gradually lowering the price."], ["Marketing", "What is 'product life cycle'?", "The stages a product passes through from launch to withdrawal: introduction, growth, maturity and decline - each stage requiring different marketing strategies."], ["Marketing", "Define 'market segmentation'.", "Dividing a total market into smaller groups of customers with similar needs, characteristics or behaviours, so a business can target its marketing mix more effectively."], ["Marketing", "What is 'branding'?", "The process of creating a unique name, image and identity for a product to differentiate it in the minds of consumers."], ["Marketing", "What is the marketing concept?", "The idea that a business should identify and satisfy customer needs and wants as the basis for its operations."], ["Marketing", "What is 'market orientation'?", "A business philosophy that focuses on researching and meeting customer needs before producing goods or services."], ["Marketing", "What are the steps in the marketing process?", "Situational analysis, market research, establishing objectives, identifying target markets, developing marketing strategies, implementation and control."], ["Marketing", "What is a SWOT analysis used for in marketing?", "Assessing a business's internal Strengths and Weaknesses and external Opportunities and Threats."], ["Marketing", "What is 'market research'?", "The process of gathering, recording and analysing data about customers, competitors and the market."], ["Marketing", "What is the difference between primary and secondary market research?", "Primary research is collected first-hand by the business; secondary research uses existing data already published by others."], ["Marketing", "What is a 'target market'?", "The specific group of customers a business aims its marketing strategies at."], ["Marketing", "What is 'product differentiation'?", "Making a product distinct from competitors through features, quality, branding or packaging."], ["Marketing", "What is 'positioning' in marketing?", "Creating a distinct image or perception of a product in the minds of target customers relative to competitors."], ["Marketing", "What is an 'intensive' distribution strategy?", "Making a product available in as many outlets as possible, suited to convenience goods."], ["Marketing", "What is a 'selective' distribution strategy?", "Distributing a product through a limited number of outlets that fit the brand image."], ["Marketing", "What is an 'exclusive' distribution strategy?", "Distributing a product through only one or very few outlets in an area, often for luxury goods."], ["Marketing", "What is 'personal selling'?", "Direct, face-to-face promotion between a salesperson and a potential customer."], ["Marketing", "What is 'relationship marketing'?", "Building long-term relationships with customers to encourage loyalty and repeat business."], ["Marketing", "What is a 'sales promotion'?", "Short-term incentives, like discounts or competitions, used to encourage immediate purchase."], ["Marketing", "What is 'publicity' in the promotion mix?", "Free, non-paid coverage of a business or product in the media."], ["Marketing", "What is 'public relations' (PR)?", "Managed communication activities designed to build and maintain a positive public image of a business."], ["Marketing", "What are 'opinion leaders' in marketing?", "Individuals whose views influence the purchasing decisions of others, e.g. influencers."], ["Marketing", "What is 'word of mouth' marketing?", "Informal communication between consumers that spreads opinions about a product or business."], ["Marketing", "What is 'global branding'?", "Using the same brand name, image and marketing message across all international markets."], ["Marketing", "What is the difference between 'standardisation' and 'customisation' in global marketing?", "Standardisation uses the same marketing approach everywhere; customisation adapts marketing to local markets' needs and culture."], ["Marketing", "What is 'competitive positioning'?", "Deciding how a business wants its product perceived relative to competitors in the global marketplace."], ["Finance", "Define 'working capital'.", "The funds a business has available for day-to-day operations, calculated as current assets minus current liabilities."], ["Finance", "Define 'liquidity'.", "A business's ability to meet its short-term debts as they fall due."], ["Finance", "Distinguish retained profits from ordinary shares as sources of finance.", "Retained profits are internal finance - profit kept in the business rather than distributed to owners. Ordinary shares are external equity finance - funds raised by selling ownership stakes to investors."], ["Finance", "What is the purpose of comparative ratio analysis?", "To give financial ratios meaning by comparing them over different time periods, against industry standards, or with similar businesses, rather than assessing a ratio in isolation."], ["Finance", "What does the debt to equity (gearing) ratio measure?", "The proportion of a business's finance that comes from debt relative to equity, calculated as total liabilities divided by total equity - a higher ratio means greater reliance on borrowed funds and financial risk."], ["Finance", "What is 'profitability'?", "A business's ability to maximise its profit relative to sales revenue or asset base."], ["Finance", "What are the key financial objectives of a business?", "Profitability, liquidity, efficiency, growth and solvency."], ["Finance", "What is 'solvency'?", "A business's ability to meet all its debts, both short-term and long-term."], ["Finance", "What is 'growth' as a financial objective?", "The ability of a business to increase its size and operations over time, e.g. through increased sales or assets."], ["Finance", "What is 'debt finance'?", "Funds borrowed by a business that must be repaid, usually with interest, e.g. a bank loan."], ["Finance", "What is 'equity finance'?", "Funds raised by a business from its owners, such as through share issues or owner contributions."], ["Finance", "What is 'factoring'?", "Selling a business's accounts receivable (unpaid invoices) to a third party at a discount for immediate cash."], ["Finance", "What is a 'cash flow statement'?", "A financial report showing the cash inflows and outflows of a business over a period."], ["Finance", "What is 'distribution of payments' as a cash flow strategy?", "Spreading large payments over time rather than paying all at once, to smooth cash flow."], ["Finance", "What is a 'discount for early payment'?", "A price reduction offered to customers who pay their accounts before the due date, encouraging faster cash inflow."], ["Finance", "What is the 'current ratio'?", "A liquidity ratio calculated as current assets divided by current liabilities."], ["Finance", "What is the 'gross profit ratio'?", "A profitability ratio showing gross profit as a percentage of sales revenue."], ["Finance", "What is the 'net profit ratio'?", "A profitability ratio showing net profit as a percentage of sales revenue."], ["Finance", "What is 'return on equity'?", "A profitability ratio measuring net profit as a percentage of owners' equity invested in the business."], ["Finance", "What is the 'expense ratio'?", "An efficiency ratio showing total expenses as a percentage of sales revenue."], ["Finance", "What is the 'accounts receivable turnover ratio'?", "An efficiency ratio measuring how quickly a business collects payments owed by customers."], ["Finance", "What is 'normalised earnings'?", "Adjusting reported profit to remove one-off or unusual items, giving a clearer picture of ongoing performance."], ["Finance", "What does 'capitalising expenses' mean?", "Recording an expense as an asset on the balance sheet rather than as a cost, which can inflate reported profit."], ["Finance", "Why is 'valuing assets' a limitation of financial reports?", "Assets can be valued using different methods (e.g. historical cost vs market value), affecting comparability."], ["Finance", "What are 'notes to the financial statements'?", "Additional information accompanying financial reports that explains figures and accounting policies used."], ["Finance", "What role do 'superannuation funds' play as a financial institution?", "They pool retirement savings and invest them, providing a source of funds businesses can borrow or raise equity from."], ["Finance", "What is the role of the 'Australian Securities Exchange' (ASX)?", "It provides a market where businesses can raise equity finance by issuing shares to investors."], ["Finance", "What ethical issue can arise in financial reporting?", "Businesses may be tempted to manipulate figures to present a misleadingly favourable financial position."], ["Human Resources", "What is occupational health and safety (OH&S)?", "Laws and practices designed to ensure a safe working environment and protect employees from workplace hazards."], ["Human Resources", "What is the Fair Work Commission?", "Australia's national workplace relations tribunal, which handles matters such as unfair dismissal claims and enterprise agreement approvals."], ["Human Resources", "Define 'separation' in the HR process.", "The stage of the HR process where an employee's relationship with the business ends, either voluntarily (resignation, retirement) or involuntarily (redundancy, dismissal)."], ["Human Resources", "What is corporate social responsibility (CSR)?", "A business's obligation to act ethically and consider its impact on stakeholders, society and the environment beyond its legal obligations."], ["Human Resources", "What is an award (in an employment context)?", "A legal document that sets out minimum pay rates and conditions of employment for a particular industry or occupation."], ["Human Resources", "What is 'enterprise bargaining'?", "A process where employers and employees negotiate pay and conditions collectively at the workplace level, resulting in an enterprise agreement."], ["Human Resources", "What is the goal of human resource management?", "To effectively manage the employer-employee relationship so business goals and employee needs are both met."], ["Human Resources", "What are the key HR processes?", "Acquisition, development, maintenance and separation of staff."], ["Human Resources", "What is 'internal recruitment'?", "Filling a vacancy with an existing employee from within the business."], ["Human Resources", "What is 'external recruitment'?", "Filling a vacancy with a person from outside the business."], ["Human Resources", "What is 'induction' in HR?", "The process of introducing new employees to the business, its policies, culture and their role."], ["Human Resources", "What is 'performance management' in HR?", "Ongoing processes such as appraisals and feedback used to assess and improve employee performance."], ["Human Resources", "What is 'staff turnover' and why does it matter?", "The rate at which employees leave and are replaced; high turnover can signal poor HR management and increases recruitment costs."], ["Human Resources", "What does 'absenteeism' indicate about HR effectiveness?", "High absenteeism can indicate low morale, poor working conditions or dissatisfaction with management."], ["Human Resources", "What is 'workplace disputation'?", "Conflict between employers and employees, which can escalate to strikes or other industrial action."], ["Human Resources", "What is 'equal employment opportunity' (EEO)?", "Ensuring all employees have fair and equal access to employment and advancement, regardless of attributes like gender or age."], ["Human Resources", "What is 'anti-discrimination' legislation?", "Laws that make it illegal to treat someone unfairly based on attributes such as race, sex, age or disability."], ["Human Resources", "What are 'employer associations'?", "Organisations that represent the interests of employers, such as in industrial relations negotiations."], ["Human Resources", "What is the role of 'unions' in HR?", "Organisations that represent employees' interests, negotiating pay and conditions on their behalf."], ["Human Resources", "How is HR interdependent with operations?", "HR supplies the trained staff operations needs, while operations targets shape HR's recruitment and training needs."], ["Human Resources", "How is HR interdependent with marketing?", "HR trains staff to deliver good customer service, supporting the business's marketing and brand reputation."], ["Human Resources", "What is 'training and development'?", "Activities that improve employees' skills and knowledge, such as on-the-job coaching or external courses."], ["Human Resources", "What is a 'redundancy'?", "Termination of employment because a position is no longer needed by the business."], ["Human Resources", "What is 'unfair dismissal'?", "Termination of an employee's contract that is harsh, unjust or unreasonable."], ["Human Resources", "What is an 'enterprise agreement'?", "A workplace agreement on pay and conditions negotiated between an employer and its employees, usually via enterprise bargaining."], ["Human Resources", "What does 'wellbeing' cover in HR management?", "Employee physical, mental and social welfare, supported through initiatives like flexible work or wellness programs."], ["Human Resources", "What is 'general skill' vs 'specific skill' recruitment?", "General skills are broadly transferable across roles/industries; specific skills are role- or industry-specific and may need targeted recruitment."], ["Human Resources", "Why is 'communication' important in the employer-employee relationship?", "Clear, two-way communication helps resolve issues, build trust and align employees with business goals."], ["Operations", "What is 'just-in-time' (JIT) inventory management?", "A strategy where materials/stock are ordered and received only as needed for production or sale, reducing storage costs but requiring reliable suppliers."], ["Operations", "What is the difference between quality control and quality assurance?", "Quality control checks finished products/outputs against a standard; quality assurance focuses on improving and monitoring the whole production process to prevent defects before they occur."], ["Marketing", "What are the 4 Ps of the marketing mix?", "Product, Price, Promotion and Place - the four core elements a business manages to market its product or service."], ["Marketing", "What is 'market segmentation'?", "Dividing a broad target market into smaller groups of consumers with similar needs or characteristics, allowing more tailored marketing strategies."], ["Finance", "What is the difference between a fixed cost and a variable cost?", "A fixed cost stays the same regardless of production/sales volume (e.g. rent); a variable cost changes in proportion to production/sales volume (e.g. raw materials)."], ["Finance", "What does the 'current ratio' measure?", "A liquidity ratio (current assets divided by current liabilities) showing a business's ability to pay its short-term debts using its short-term assets."], ["Human Resources", "What is 'enterprise bargaining'?", "A process where an employer and employees (or their union) negotiate an enterprise agreement setting out wages and conditions specific to that workplace, rather than relying solely on the award."], ["Human Resources", "What is the difference between training and development in HR?", "Training builds specific skills needed for a current role; development is broader, longer-term growth preparing an employee for future responsibilities or roles."], ["Operations", "What are the 5 performance objectives operations managers aim to achieve?", "Cost, quality, speed, dependability and flexibility - operations strategies are usually evaluated against how well they improve one or more of these."], ["Operations", "How can global factors influence a business's operations?", "Access to overseas suppliers and markets, exchange rate fluctuations affecting import/export costs, and global supply chain disruptions can all significantly affect operations decisions and costs."], ["Marketing", "What are the extended '7 Ps' of the marketing mix, beyond the original 4?", "People, Process and Physical evidence - added to Product, Price, Promotion and Place, especially relevant for service-based businesses."], ["Marketing", "What is the purpose of monitoring and controlling in the marketing process?", "Regularly checking marketing performance (e.g. sales figures, customer feedback) against objectives, so a business can adjust its strategy if it isn't achieving desired results."], ["Finance", "What is 'working capital' and why does a business need to manage it?", "The funds a business has available for day-to-day operations (current assets minus current liabilities) - poor working capital management can cause a business to struggle to pay short-term bills even if it's profitable overall."], ["Finance", "Name a global financial strategy a business might use.", "Any example such as hedging against exchange rate risk, sourcing finance from international lenders, or offshoring parts of production to reduce costs in foreign currency terms."], ["Human Resources", "What does 'separation' mean in a Human Resources context?", "The ending of an employee's relationship with a business, which can be voluntary (resignation, retirement) or involuntary (redundancy, dismissal)."], ["Human Resources", "Name an indicator used to measure HR effectiveness.", "Any example such as staff turnover rate, absenteeism rate, level of staff satisfaction/engagement, or productivity per employee."], ["Command Words", "What does 'identify' mean as an exam command word?", "Recognise and name something clearly - one of the simplest, lowest-mark command words."], ["Command Words", "What does 'describe' mean as an exam command word?", "State the features or characteristics of something, without needing to explain why."], ["Command Words", "What does 'outline' mean as an exam command word?", "Give a brief summary of the main points, without going into full detail."], ["Command Words", "What does 'explain' mean as an exam command word?", "Show cause and effect - make clear why or how something happens, not just what it is."], ["Command Words", "What does 'analyse' mean as an exam command word?", "Break something into its parts, identify how those parts relate to each other, and draw out what this means."], ["Command Words", "What does 'discuss' mean as an exam command word?", "Explore an issue by presenting points for and/or against it."], ["Command Words", "What does 'assess' mean as an exam command word?", "Make a judgement about the value, quality, outcome or importance of something."], ["Command Words", "What does 'evaluate' mean as an exam command word?", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of something."], ["Command Words", "What does 'justify' mean as an exam command word?", "Support an argument or conclusion with reasons and evidence."], ["Command Words", "What does 'compare' mean as an exam command word?", "Show how two or more things are similar."], ["Command Words", "What does 'contrast' mean as an exam command word?", "Show how two or more things are different."], ["Command Words", "What does 'distinguish' mean as an exam command word?", "Identify and explain the differences between two things that might otherwise seem similar."], ["Command Words", "What does 'examine' mean as an exam command word?", "Inquire into something closely and in detail to understand it fully."], ["Command Words", "What does 'define' mean as an exam command word?", "State the precise meaning of a term and identify its essential features."], ["Command Words", "What does 'interpret' mean as an exam command word?", "Draw meaning from information, data or a source rather than just describing it."], ["Command Words", "What does 'account for' mean as an exam command word?", "State reasons for something, or report on why or how it happened."], ["Command Words", "What does 'apply' mean as an exam command word?", "Use knowledge, a formula or a method in a specific situation or scenario."], ["Command Words", "What does 'investigate' mean as an exam command word?", "Plan, inquire into and draw conclusions about a topic."], ["Command Words", "What does 'propose' mean as an exam command word?", "Put forward an idea, argument or suggestion for consideration."], ["Command Words", "What does 'predict' mean as an exam command word?", "Suggest a likely outcome based on the information available."], ["Command Words", "What does adding 'critically' before 'analyse' or 'evaluate' change?", "It asks for an extra degree of depth, rigour, questioning and reflection beyond a standard analyse/evaluate response."], ["Command Words", "Why does it matter which command word an HSC question uses?", "Command words indicate exactly what kind of response is expected and roughly how many marks are available - lower-order words (identify, outline) are usually worth fewer marks than higher-order words (analyse, evaluate), so answering with the wrong depth costs marks even with correct content."], ["Command Words", "What is the general hierarchy of command words from lowest to highest order?", "Roughly: identify/outline -> describe -> explain -> analyse/discuss -> assess/evaluate -> critically analyse/evaluate, with depth and mark value increasing up the hierarchy."], ["Operations", "What is a Gantt chart used for in operations?", "A scheduling tool that shows tasks/activities on a timeline, letting managers plan, sequence and monitor progress against deadlines and see which tasks can run in parallel."], ["Operations", "What is critical path analysis (CPA/PERT)?", "A planning technique that maps out all tasks needed to complete a project, identifying the sequence of dependent tasks (the 'critical path') that determines the minimum time the whole project will take."], ["Operations", "What is computer-aided design (CAD) and computer-aided manufacturing (CAM)?", "CAD uses software to design products/prototypes digitally; CAM uses computer systems to control machinery in production. Together they speed up design, improve precision, and reduce costs."], ["Operations", "What is sales forecasting and why does it matter for operations?", "Predicting future customer demand so a business can plan inputs, production levels, staffing and inventory accordingly - inaccurate forecasts lead to overstocking or stockouts."], ["Operations", "Outline the stages of new product/service development.", "Research and development, design, and evaluation - a business generates ideas, screens them for feasibility, develops prototypes, tests them, and evaluates results before full production."], ["Operations", "What are 'standing plans' vs 'single-use plans' in operations planning?", "Standing plans (policies, procedures, rules) apply repeatedly to recurring situations; single-use plans (budgets, programs, projects) are developed for a specific, one-off purpose."], ["Operations", "How can environmental sustainability act as an operations strategy?", "Reducing waste, using renewable resources/energy, recycling and minimising pollution - can lower costs long-term and improve brand reputation, though it may raise short-term costs."], ["Operations", "What is 'robotics' and its impact on operations?", "The use of automated machines/robots to perform tasks in production - increases speed, precision and consistency, but requires large capital investment and can reduce labour needs."], ["Marketing", "What is 'penetration pricing'?", "Setting an initially low price to quickly gain market share and attract customers away from competitors, then potentially raising the price once established."], ["Marketing", "What is 'loss leader pricing'?", "Pricing one product below cost to attract customers into a store, in the hope they buy other, more profitable items while there."], ["Marketing", "What is 'psychological pricing'?", "Setting prices (e.g. $9.99 instead of $10) to influence customer perception, making a price seem lower or product seem premium than it actually is."], ["Marketing", "What is e-marketing (online/digital marketing)?", "Using digital channels - websites, social media, search engines, email - to promote and sell products, allowing highly targeted, measurable and often cheaper reach than traditional media."], ["Marketing", "What is 'viral marketing'?", "A promotional strategy that encourages people to share content (often via social media) so it spreads rapidly between consumers, generating exposure at low cost."], ["Marketing", "What role does the Australian Consumer Law (ACL) / ACCC play in marketing?", "The ACL protects consumers from misleading advertising, false claims and unfair practices; the ACCC (Australian Competition and Consumer Commission) enforces this law, investigating and penalising businesses that breach it."], ["Marketing", "In the extended marketing mix, what do 'people', 'process' and 'physical evidence' refer to?", "People: staff who interact with customers and affect service quality. Process: the systems/procedures used to deliver a product/service. Physical evidence: the tangible cues (store layout, packaging, website) customers use to judge quality."], ["Marketing", "How can economic factors influence marketing decisions?", "Consumer/business confidence, interest rates, unemployment and inflation affect how much customers can spend, shaping pricing, promotion intensity and product positioning."], ["Finance", "What is break-even analysis?", "A technique that calculates the sales level (in units or dollars) at which total revenue equals total costs - beyond this point, the business makes a profit; below it, a loss."], ["Finance", "How is the break-even point calculated?", "Break-even point (units) = Fixed Costs / (Selling Price per unit - Variable Cost per unit). This is the quantity that must be sold to cover all costs."], ["Finance", "What's the difference between financial accounting and management accounting?", "Financial accounting reports historical financial performance to external users (investors, creditors) following accounting standards; management accounting provides detailed, forward-looking information to internal managers for decision-making, with no set format."], ["Finance", "What is the 'quick ratio' (acid-test ratio)?", "(Current Assets - Inventory) / Current Liabilities - measures a business's ability to meet short-term debts using only its most liquid assets, excluding inventory which may be slow to sell."], ["Finance", "What is 'leasing' as a source of finance?", "Paying to use an asset (e.g. equipment, vehicles) over time without owning it outright - avoids large upfront capital outlay but can cost more over the asset's life than buying."], ["Finance", "What is 'sale and lease back'?",
