"A business sells an asset it owns (e.g. its building) to a financial institution, then leases it back for continued use - frees up cash while keeping use of the asset."], ["Finance", "What is exchange rate risk, and how can a business manage it?", "The risk that currency value fluctuations affect the cost/revenue of international transactions. Managed through hedging - e.g. forward exchange contracts that lock in a future exchange rate."], ["Finance", "How does insurance act as a financial risk management strategy?", "A business pays a premium to transfer the financial risk of specific losses (fire, theft, liability) to an insurer, protecting against large unexpected costs."], ["Finance", "What's the difference between internal and external auditing?", "Internal audits are conducted by employees within the business to check internal controls and processes; external audits are conducted by independent auditors to verify financial statements are accurate and comply with accounting standards."], ["Finance", "What's the difference between short-term and long-term sources of finance?", "Short-term finance (e.g. overdraft, trade credit) covers immediate/working capital needs and is usually repaid within a year; long-term finance (e.g. shares, mortgage) funds major investments and is repaid over years."], ["Human Resources", "What is 'remuneration' in HR, and name two forms it can take.", "The financial and non-financial reward employees receive for their work. Forms include wages/salaries, commission, bonuses, and non-financial benefits like flexible hours or extra leave."], ["Human Resources", "What's the difference between a wage and a salary?", "A wage is paid per hour worked (varies with hours); a salary is a fixed annual amount paid regardless of hours worked."], ["Human Resources", "What is 'job enlargement' in HR?", "Increasing the number and variety of tasks in a job at the same skill level, aiming to reduce boredom and increase job satisfaction."], ["Human Resources", "What is 'job enrichment' in HR?", "Giving employees more responsibility, autonomy and decision-making power in their role, increasing skill level and motivation - not just more tasks, but more meaningful ones."], ["Human Resources", "What is 'job rotation' in HR?", "Moving employees between different tasks or roles periodically, to reduce monotony, build a wider skill set, and provide flexibility for the business."], ["Human Resources", "Name the main methods used to resolve workplace disputes.", "Negotiation (direct discussion between parties), mediation (a neutral third party helps reach agreement), grievance procedures (formal internal process), and arbitration (a third party makes a binding decision)."], ["Human Resources", "What is the difference between mediation and arbitration?", "In mediation, a neutral third party helps the disputing parties reach their own agreement (non-binding); in arbitration, a third party listens to both sides and makes a binding decision for them."], ["Human Resources", "What is 'succession planning' in HR?", "Identifying and developing employees internally to fill key leadership/management roles in the future, ensuring continuity when senior staff leave or retire."], ["Human Resources", "Name the ways an employee's employment can end (separation).", "Resignation (employee chooses to leave), retirement, redundancy (role no longer needed), and dismissal (employer ends employment, fairly or unfairly)."], ["Human Resources", "What piece of legislation sets the national framework for employment conditions and the Fair Work Commission's powers?", "The Fair Work Act 2009 (Cth) - establishes minimum employment standards, awards, enterprise bargaining processes and unfair dismissal protections."], ["Human Resources", "What legislation governs workplace health and safety obligations?", "Work Health and Safety (WHS) laws - require employers to provide a safe working environment, and employees to follow safety procedures, to prevent injury and illness at work."], ["Operations", "How is operations management interdependent with marketing, finance and HR?", "Marketing forecasts drive production volumes; finance sets budgets/capital for equipment; HR supplies and trains the workforce needed to run operations - a change in one function forces adjustments in the others."], ["Operations", "How do changing quality expectations influence operations management?", "As customers expect higher quality/reliability, operations managers must invest in better inputs, processes and quality control to stay competitive, which can raise costs but also brand reputation."], ["Operations", "What is a 'quality circle'?", "A small group of employees who meet regularly to identify, analyse and solve quality-related problems in their work area, drawing on staff closest to the process."], ["Operations", "How can e-commerce be used as an operations strategy?", "Selling and taking orders online lets a business reduce retail/facility costs, reach a wider market, and better track/forecast demand - though it requires investment in technology and logistics."], ["Operations", "What are the 'outputs' of the operations (transformation) process?", "Goods, services, and waste - the tangible/intangible results a business produces from its inputs, with waste minimisation an increasingly important consideration."], ["Operations", "How can global trade agreements (e.g. through the WTO) influence a business's operations?", "Reduced tariffs/trade barriers can make importing materials or exporting products cheaper and easier, encouraging businesses to source globally or expand into new markets."], ["Marketing", "What are the main types of markets a business might operate in?", "Resource markets (raw materials), industrial/intermediate markets (businesses buying from other businesses), and consumer markets (individuals buying for personal use)."], ["Marketing", "What's the difference between a 'mass market' and a 'niche market'?", "A mass market targets a broad range of customers with a standardised product; a niche market targets a small, specific segment with more tailored products, often at a premium price."], ["Marketing", "What is 'packaging' as a product strategy, and what functions does it serve?", "The physical container/wrapping of a product - serves practical functions (protection, storage, convenience) and marketing functions (branding, attracting attention, informing consumers)."], ["Marketing", "What is 'advertising' as a promotion strategy, and name two forms it can take.", "Paid, non-personal communication about a product through a mass medium to persuade/inform consumers - forms include television, print, radio, outdoor (billboards) and online advertising."], ["Marketing", "How can market growth or decline influence a business's marketing strategy?", "In a growing market, businesses focus on capturing new customers and building brand awareness; in a declining market, they may focus on customer retention, cost-cutting, or diversifying into new products."], ["Finance", "What is the Income Statement (Profit and Loss Statement), and what does it show?", "A financial report showing a business's revenue, expenses and resulting profit or loss over a specific period (e.g. a financial year)."], ["Finance", "What is the Balance Sheet, and what does it show?", "A financial report showing a business's assets, liabilities and owner's equity at a single point in time - it must always balance (Assets = Liabilities + Owner's Equity)."], ["Finance", "What is a 'budget' in financial management?", "A financial plan that estimates future income and expenses over a set period, used to guide spending decisions and measure actual performance against a target."], ["Finance", "What's the difference between cash accounting and accrual accounting?", "Cash accounting records transactions when money actually changes hands; accrual accounting records transactions when they occur (e.g. a sale is recorded when made, even if payment comes later)."], ["Finance", "What role do banks and finance companies play as financial institutions?", "Banks provide savings/transaction accounts, loans and overdrafts; finance companies specialise in lending for specific purposes (e.g. equipment finance, leasing) - both are key sources of external debt finance for businesses."], ["Finance", "What is a 'bank overdraft', and why might a business use one?", "A short-term finance facility that lets a business withdraw more money than is in its account, up to an agreed limit - useful for covering short-term cash flow gaps."], ["Finance", "How can a business manage its debtors and creditors to improve cash flow?", "Managing debtors: offering discounts for early payment, charging interest on overdue accounts, or using debt collection. Managing creditors: negotiating longer payment terms to delay outflows without damaging supplier relationships."], ["Finance", "What is a 'letter of credit' in international finance?", "A document from a bank guaranteeing payment to a seller on behalf of a buyer, provided certain conditions are met - reduces the risk of non-payment in international trade."], ["Human Resources", "Name the three classic leadership styles used in HR management.", "Autocratic (manager makes decisions alone, tight control), democratic (manager consults/involves employees in decisions), and laissez-faire (manager gives employees high autonomy with minimal direction)."], ["Human Resources", "What is 'selection' in HR, as distinct from recruitment?", "Recruitment is attracting a pool of applicants for a role; selection is the process of choosing the best candidate from that pool, using methods like interviews, reference checks, and skills/psychometric testing."], ["Human Resources", "How can economic conditions influence HR management?", "In a strong economy with low unemployment, businesses may struggle to recruit and need to offer better pay/conditions; in a downturn, businesses may face redundancies and easier recruitment from a larger pool of applicants."], ["Human Resources", "How is technology changing HR management?", "Automation can reduce the need for certain roles, while also creating demand for new technical skills; HR software (HRIS) is increasingly used for recruitment, payroll and performance tracking."], ["Human Resources", "How is labour turnover rate calculated, and what does a high rate suggest?", "(Number of employees who left \u00f7 average number of employees) x 100. A high rate can suggest poor job satisfaction, ineffective HR practices, or a genuinely competitive job market - and is costly due to recruitment/training expenses."], ["Marketing", "Name the four stages of the product life cycle.", "Introduction (launch, low sales, high promotion costs), Growth (rising sales, increasing competition), Maturity (sales peak/plateau, market saturation), and Decline (falling sales as the product becomes outdated or replaced)."], ["Human Resources", "Name examples of flexible work arrangements a business might offer.", "Part-time work, casual employment, job-sharing, flexible/staggered hours, and telecommuting (working from home) - can improve work-life balance and help attract/retain staff."]], "m": [["Operations", "What does JIT stand for?", ["Just-in-time", "Job in transit", "Joint inventory tracking", "Justified income tax"], 0, "JIT minimises stock held by ordering only as needed."], ["Operations", "When does quality control check outputs?", ["After production, against a standard", "Before any production begins", "Only during marketing", "Only in HR"], 0, "Quality control checks finished goods after production."], ["Operations", "What are 'transformed resources'?", ["Inputs converted into outputs", "Retained profits", "Marketing channels", "Employee awards"], 0, "They are the materials/information acted upon during production."], ["Marketing", "What are the four Ps of marketing?", ["Product, price, place, promotion", "Profit, people, process, proof", "Plan, produce, promote, profit", "Position, price, product, people"], 0, "These make up the traditional marketing mix."], ["Marketing", "What is 'price skimming'?", ["Starting high, then lowering the price", "Starting low, then raising the price", "Matching competitor prices exactly", "Selling below cost permanently"], 0, "Skimming maximises early revenue from a high initial price."], ["Marketing", "What is market segmentation?", ["Dividing a market into similar groups", "Merging with all competitors", "Setting one universal price", "Ignoring customer differences"], 0, "Segmentation groups customers by shared needs or traits."], ["Finance", "What is 'liquidity'?", ["Ability to meet short-term debts", "Total company profit", "Long-term growth rate", "Brand reputation"], 0, "Liquidity measures how easily debts can be paid on time."], ["Finance", "What is 'working capital'?", ["Current assets minus current liabilities", "Total revenue minus tax", "Fixed assets only", "Shareholder equity"], 0, "Working capital funds day-to-day operations."], ["Finance", "The debt to equity ratio measures:", ["Reliance on borrowed funds vs equity", "Total sales growth", "Employee turnover", "Market share"], 0, "A higher ratio means more reliance on debt financing."], ["Human Resources", "What is the Fair Work Commission?", ["Australia's workplace relations tribunal", "A business's marketing team", "A bank regulator", "A consumer watchdog"], 0, "It handles matters like unfair dismissal and agreements."], ["Human Resources", "What is an 'award' in employment?", ["A minimum pay and conditions document", "A trophy for sales performance", "A tax refund", "A loan agreement"], 0, "Awards set legally binding minimum employment conditions."], ["Human Resources", "What does OH&S stand for?", ["Occupational health and safety", "Overseas hiring standards", "Operational HR services", "Ongoing hourly salary"], 0, "OH&S laws protect employee safety at work."]], "t": [["Operations", "A management approach focused on minimising waste while maximising productivity.", "lean production", ["lean production"]], ["Operations", "The increasing integration and interdependence of economies worldwide, allowing businesses to source.", "globalisation", ["globalisation"]], ["Operations", "To efficiently and effectively manage the resources and processes used to produce goods and services.", "goal of operations management", ["goal of operations management"]], ["Operations", "Quality, speed, dependability and flexibility.", "four production performance objectives", ["four production performance objectives"]], ["Operations", "A computer-based system that calculates and orders the materials needed for production based on forecast.", "materials requirement planning / MRP", ["materials requirement planning", "MRP"]], ["Operations", "Producing a single, customised product to a customer's specific order, e.g.", "job production", ["job production"]], ["Operations", "Producing a group of identical items together before moving on to a different batch, e.g.", "batch production", ["batch production"]], ["Operations", "Continuous, standardised production of identical products on an assembly line, e.g.", "flow production", ["flow production"]], ["Operations", "Coordinating and integrating the flow of materials.", "supply chain management", ["supply chain management"]], ["Operations", "A data-driven quality management technique aiming to reduce defects to near zero by identifying and removing.", "six sigma", ["six sigma"]], ["Operations", "The conversion of inputs into outputs.", "transformation process", ["transformation process"]], ["Operations", "A resource that acts upon other resources during production.", "transforming resource", ["transforming resource"]], ["Marketing", "The stages a product passes through from launch to withdrawal: introduction, growth.", "product life cycle", ["product life cycle"]], ["Marketing", "The process of creating a unique name, image and identity for a product to differentiate it in the minds of.", "branding", ["branding"]], ["Marketing", "The idea that a business should identify and satisfy customer needs and wants as the basis for its operations.", "marketing concept", ["marketing concept"]], ["Marketing", "A business philosophy that focuses on researching and meeting customer needs before producing goods or.", "market orientation", ["market orientation"]], ["Marketing", "The process of gathering, recording and analysing data about customers, competitors and the market.", "market research", ["market research"]], ["Marketing", "The specific group of customers a business aims its marketing strategies at.", "target market", ["target market"]], ["Marketing", "Making a product distinct from competitors through features, quality, branding or packaging.", "product differentiation", ["product differentiation"]], ["Marketing", "Direct, face-to-face promotion between a salesperson and a potential customer.", "personal selling", ["personal selling"]], ["Marketing", "Building long-term relationships with customers to encourage loyalty and repeat business.", "relationship marketing", ["relationship marketing"]], ["Marketing", "Short-term incentives, like discounts or competitions, used to encourage immediate purchase.", "sales promotion", ["sales promotion"]], ["Marketing", "Managed communication activities designed to build and maintain a positive public image of a business.", "public relations / PR", ["public relations", "PR"]], ["Marketing", "Using the same brand name, image and marketing message across all international markets.", "global branding", ["global branding"]], ["Marketing", "Deciding how a business wants its product perceived relative to competitors in the global marketplace.", "competitive positioning", ["competitive positioning"]], ["Finance", "A business's ability to maximise its profit relative to sales revenue or asset base.", "profitability", ["profitability"]], ["Finance", "A business's ability to meet all its debts, both short-term and long-term.", "solvency", ["solvency"]], ["Finance", "Funds borrowed by a business that must be repaid.", "debt finance", ["debt finance"]], ["Finance", "Funds raised by a business from its owners.", "equity finance", ["equity finance"]], ["Finance", "Selling a business's accounts receivable to a third party at a discount for immediate cash.", "factoring", ["factoring"]], ["Finance", "A financial report showing the cash inflows and outflows of a business over a period.", "cash flow statement", ["cash flow statement"]], ["Finance", "A price reduction offered to customers who pay their accounts before the due date.", "discount for early payment", ["discount for early payment"]], ["Finance", "A liquidity ratio calculated as current assets divided by current liabilities.", "current ratio", ["current ratio"]], ["Finance", "A profitability ratio showing gross profit as a percentage of sales revenue.", "gross profit ratio", ["gross profit ratio"]], ["Finance", "A profitability ratio showing net profit as a percentage of sales revenue.", "net profit ratio", ["net profit ratio"]], ["Finance", "A profitability ratio measuring net profit as a percentage of owners' equity invested in the business.", "return on equity", ["return on equity"]], ["Finance", "An efficiency ratio showing total expenses as a percentage of sales revenue.", "expense ratio", ["expense ratio"]], ["Finance", "An efficiency ratio measuring how quickly a business collects payments owed by customers.", "accounts receivable turnover ratio", ["accounts receivable turnover ratio"]], ["Finance", "Adjusting reported profit to remove one-off or unusual items, giving a clearer picture of ongoing performance.", "normalised earnings", ["normalised earnings"]], ["Finance", "Recording an expense as an asset on the balance sheet rather than as a cost.", "capitalising expenses", ["capitalising expenses"]], ["Finance", "Additional information accompanying financial reports that explains bing it.", "interpret", ["interpret"]], ["Command Words", "State reasons for something, or report on why or how it happened.", "account for", ["account for"]], ["Command Words", "Use knowledge, a formula or a method in a specific situation or scenario.", "apply", ["apply"]], ["Command Words", "Plan, inquire into and draw conclusions about a topic.", "investigate", ["investigate"]], ["Command Words", "Put forward an idea, argument or suggestion for consideration.", "propose", ["propose"]], ["Command Words", "Suggest a likely outcome based on the information available.", "predict", ["predict"]], ["Marketing", "Setting an initially low price to quickly gain market share and attract customers away from competitors.", "penetration pricing", ["penetration pricing"]], ["Marketing", "Pricing one product below cost to attract customers into a store, in the hope they buy other.", "loss leader pricing", ["loss leader pricing"]], ["Marketing", "Setting prices to influence customer perception.", "psychological pricing", ["psychological pricing"]], ["Marketing", "A promotional strategy that encourages people to share content so it spreads rapidly between consumers.", "viral marketing", ["viral marketing"]], ["Finance", "A technique that calculates the sales level at.", "break-even analysis", ["break-even analysis"]], ["Finance", "/ Current Liabilities - measures a business's ability to meet short-term debts using only its most liquid.", "quick ratio / acid-test ratio", ["quick ratio", "acid-test ratio"]], ["Finance", "A business sells an asset it owns to a financial institution.", "sale and lease back", ["sale and lease back"]], ["Operations", "A small group of employees who meet regularly to identify.", "quality circle", ["quality circle"]]]}, "English Studies": {"c": [["Command Words", "What does \"Playing the Game\" explore?", "It explores competition, strategy, rules, winning, losing, teamwork, and how games reflect broader social values and power dynamics."], ["Command Words", "How do games relate to social power?", "Games reflect and reinforce social hierarchies. Winners gain status and resources; losers lose position. Games teach compliance with rules and authority structures."], ["Command Words", "What are different game types and their meanings?", "Sports (physical competition), board games (strategy, chance), video games (escapism, skill development), gambling (risk, fate). Each reveals different aspects of competition and human nature."], ["Command Words", "What does \"We Are Australians\" explore?", "It examines Australian identity, multiculturalism, Indigenous perspectives, national myths, migration, and what it means to belong in contemporary Australia."], ["Command Words", "How has Australian identity changed?", "From white, British-based identity to multicultural, inclusive identity. Recognition of Indigenous peoples, Asian migration, and questioning of traditional myths of mateship and frontier."], ["Command Words", "What are key communication features?", "Verbal (words), nonverbal (tone, gesture, body language), visual (images, color, layout), written, and digital modes all convey meaning. Context affects interpretation."], ["Command Words", "How do authors construct meaning for audiences?", "Through language choices (word, imagery, metaphor), structure, genre conventions, perspective, tone, and intertextuality. Authors adapt messages for target audiences and contexts."], ["Command Words", "What is Standard Australian English?", "Formal English used in professional, academic, and official contexts. Different from vernacular/colloquial English. Prestige and power associations affect language use."], ["Command Words", "What is meant by 'individual' vs 'collective' human experiences in this module?", "Individual experiences are personal and particular to one person (e.g. a single character's grief); collective experiences are shared by a group or community (e.g. a nation's experience of war). Texts often show how the two intersect."], ["Command Words", "Give three human experience concepts commonly explored through texts.", "Any three of: belonging, identity, memory, resilience, discovery, empathy, guilt, loss, conflict, connection, alienation, growth."], ["Command Words", "How does 'anomaly' relate to human experience in texts?", "An anomaly is something that deviates from the expected or ordinary. Texts often use anomalous events or characters (a crisis, an outsider) to reveal deeper truths about human nature and experience."], ["Command Words", "What does 'paradox' mean in the context of human experience?", "A paradox is a seemingly contradictory situation that, on reflection, reveals a truth - e.g. a character finding freedom through loss, or growth through suffering."], ["Command Words", "Why do composers use a single narrative voice to represent experience?", "A single, often first-person, narrative voice creates intimacy and subjectivity, inviting the responder to empathise closely with one perspective on an experience, though it limits objectivity."], ["Command Words", "How can structure (e.g. non-linear timelines, fragmentation) represent human experience?", "Non-linear or fragmented structure can mirror the way memory, trauma or grief are experienced - not neatly, but in disordered, resurfacing pieces - making form reflect content."], ["Command Words", "What role does context play in how a human experience is represented?", "The composer's historical, social and cultural context shapes which experiences are represented and how - e.g. a wartime text may represent resilience differently to a contemporary one."], ["Command Words", "How might two different texts represent the same human experience differently?", "Through different textual form (poem vs film), perspective (insider vs outsider), tone (hopeful vs bleak), or context - shaping very different responder reactions to the same underlying experience, e.g. loss."], ["Command Words", "What is the difference between empathy and sympathy in responding to a text?", "Empathy is understanding and sharing another's feelings as if they were your own; sympathy is feeling concern or pity for someone from a distance, without fully sharing their perspective."], ["Command Words", "Why might a composer use an unreliable narrator to represent an experience?", "An unreliable narrator forces the responder to question the account given, highlighting how personal bias, memory or trauma can distort or complicate the representation of experience."], ["Command Words", "How does setting contribute to representing a human experience?", "Setting can symbolise or intensify an experience - e.g. an isolated landscape reinforcing a character's loneliness, or a crowded city reinforcing alienation despite being surrounded by others."], ["Command Words", "What is 'resilience' as a human experience concept, and how is it usually shown in texts?", "Resilience is the capacity to recover from adversity. Texts often show it through a character's journey from crisis to some form of adaptation, strength or renewed perspective."], ["Command Words", "What is the 'Great Australian Silence'?", "A term (coined by anthropologist W.E.H. Stanner) describing the historical omission of Aboriginal and Torres Strait Islander experiences and perspectives from mainstream Australian history and identity."], ["Command Words", "What is the Uluru Statement from the Heart calling for?", "A 2017 statement calling for a constitutionally enshrined First Nations Voice to Parliament, and a Makarrata Commission to oversee truth-telling and agreement-making (treaty) between governments and Aboriginal and Torres Strait Islander peoples."], ["Command Words", "What was the significance of the 1967 referendum?", "It allowed the Commonwealth to make laws for Aboriginal people and include them in the census, following overwhelming public support - a key milestone in Indigenous rights and recognition."], ["Command Words", "What does 'mateship' traditionally represent in Australian identity, and how is it now questioned?", "Traditionally, loyalty, egalitarianism and solidarity, often linked to wartime experience (e.g. Gallipoli) and rural/working-class life. It's increasingly questioned for excluding women, Indigenous people and migrants from the 'Australian' ideal it represents."], ["Command Words", "How did the White Australia Policy shape Australian identity, and when did it end?", "It restricted non-European immigration from 1901, reinforcing a narrow Anglo-Celtic national identity; it was progressively dismantled between 1949 and 1973, opening the way for a more multicultural identity."], ["Command Words", "What is multiculturalism as an official Australian policy?", "A government policy (from the 1970s) recognising and supporting cultural diversity, encouraging migrants to maintain their heritage while participating fully in Australian society, rather than requiring full assimilation."], ["Command Words", "What tension exists between multiculturalism and a shared national identity?", "Balancing the celebration of diverse cultural identities against the desire for social cohesion and a unifying 'Australian' identity - texts often explore whether these goals conflict or can coexist."], ["Command Words", "How might Anzac Day and its mythology be represented differently across texts?", "Some texts represent it reverently, as a founding moment of national character (sacrifice, mateship); others critique or complicate the mythology, questioning who is included in the story and whether it obscures other Australian experiences."], ["Command Words", "What does 'settler-colonial' mean in discussions of Australian identity?", "It describes a society founded through colonisation and ongoing settlement on land already inhabited by Indigenous peoples, which shapes ongoing debates about legitimacy, land rights and reconciliation."], ["Command Words", "How can migrant experience be represented as both belonging and alienation?", "Migrant narratives often show simultaneous connection to a new home (opportunity, community) and disconnection (language barriers, discrimination, homesickness for the country of origin) - texts hold both experiences at once."], ["Command Words", "How can sport function as a metaphor for broader life or social experience in texts?", "Sport often stands in for themes like ambition, sacrifice, fairness, failure and redemption, letting composers explore universal human experiences through a structured, high-stakes contest."], ["Command Words", "What is 'sportsmanship' and how do texts typically represent it?", "Fair, respectful conduct in competition (win or lose). Texts often contrast sportsmanship with a 'win-at-all-costs' mentality to explore ethics, integrity and what winning should really mean."], ["Command Words", "How does sports commentary language typically construct drama and tension?", "Through short, urgent sentences, present tense, emotive language, hyperbole and rising intonation/pace to heighten excitement and involve the audience directly in the unfolding contest."], ["Command Words", "How might texts use sport to explore issues of gender equity?", "By contrasting media coverage, pay and opportunities for men's and women's sport, or by representing characters who challenge gendered expectations about who can play or excel at a sport."], ["Command Words", "How can 'the game' be used as an extended metaphor beyond literal sport?", "'Playing the game' can describe navigating unwritten social, workplace or political rules and power structures - complying with expectations to succeed, even outside literal sporting contexts."], ["Command Words", "What ethical issues around performance-enhancing drugs might a text explore?", "Tension between the drive to win and fairness/integrity; the pressure athletes face to perform; and questions about what counts as 'natural' achievement versus cheating."], ["Command Words", "How do games (not just sport) reveal something about human nature, according to this module?", "Games reveal how people respond to rules, risk, chance and competition - showing traits like resilience after loss, cooperation in team games, or the human need for structured challenge and achievement."], ["Command Words", "How might a text use sport to critique or celebrate national identity?", "International sporting contests can be represented as uniting a nation in shared pride (e.g. Olympic success), or critiqued for how they exclude, exploit or overlook certain groups in the name of national glory."], ["Command Words", "Who is the protagonist of \"Looking for Alibrandi\" and what is her background?", "Josephine (Josie) Alibrandi, a third-generation Italian-Australian teenager in her final year of school in Sydney, navigating her dual Italian and Australian identity."], ["Command Words", "What central family secret does Josie uncover in \"Looking for Alibrandi\"?", "That her grandmother, Nonna Katia, had an affair and that Josie's mother, Christina, was conceived outside Katia's marriage - revealing hidden shame across three generations of women."], ["Command Words", "How does \"Looking for Alibrandi\" represent tension between migrant and mainstream Australian identity?", "Josie is caught between her Italian heritage (family expectations, community judgement) and her aspiration to fit into \"Australian\" (Anglo, upper-class) society at her private school, often feeling she belongs fully to neither."], ["Command Words", "How is social class explored in \"Looking for Alibrandi\"?", "Through the contrast between Josie's Italian, working/middle-class background and the wealthy Anglo-Australian students at her private school, and through her relationship with Jacob Coote, a boy from a public school and different social background."], ["Command Words", "Who is Michael Andretti and what role does he play in the novel?", "Josie's biological father, a barrister who left before she was born and re-enters her life during the novel, allowing the text to explore themes of identity, belonging and reconciliation with the past."], ["Command Words", "What subplot in \"Looking for Alibrandi\" deals with mental health?", "Josie's friend John Barton, a high-achieving student under intense academic and family pressure, dies by suicide - exploring the hidden cost of expectation and perfectionism."], ["Command Words", "What does the term \"wog\" represent in the novel, and how does Josie relate to it?", "A term (reclaimed within the novel) used to identify Italian and other non-Anglo migrants; Josie's relationship with the label shifts as she moves from resenting it to more confidently owning her cultural identity by the novel's end."], ["Command Words", "How does \"Looking for Alibrandi\" ultimately resolve Josie's search for identity?", "By the end, Josie reaches a greater self-acceptance, embracing both her Italian heritage and her Australian upbringing as compatible parts of who she is, rather than a conflict she must resolve by choosing one."], ["Command Words", "What is \"Go Back to Where You Came From\"?", "An SBS reality/documentary series (first aired 2011) in which a group of everyday Australians with differing views on asylum seekers undertake, largely in reverse, the journey many refugees take to reach Australia."], ["Command Words", "What is the stated purpose of \"Go Back to Where You Came From\"?", "To challenge participants' (and viewers') preconceptions about asylum seekers and refugees by giving them direct, confronting exposure to refugee camps, conflict zones and the dangerous journey many undertake."], ["Command Words", "How does \"Go Back to Where You Came From\" use participant selection to create dramatic and persuasive effect?", "By including participants with strongly opposing initial views (some hostile toward asylum seekers, some sympathetic), the series can show attitudes being challenged or shifting over the course of the experience, making the emotional and persuasive arc more powerful."], ["Command Words", "What documentary techniques does \"Go Back to Where You Came From\" use to build empathy?", "Direct-to-camera confessional interviews revealing participants' evolving reactions, juxtaposition of participants' safe Australian lives against refugee conditions, and on-screen facts/statistics used to counter common media myths about asylum seekers."], ["Command Words", "How does \"Go Back to Where You Came From\" connect to the \"We Are Australians\" module's ideas about national identity?", "It directly interrogates who is included in or excluded from Australian identity and belonging, and critiques media and political \"us vs them\" narratives around asylum seekers and immigration."], ["Command Words", "What real-world political context does \"Go Back to Where You Came From\" respond to?", "It was produced during a period of intense Australian political debate over asylum seeker policy, including mandatory detention and border protection rhetoric, directly engaging with contemporary public discourse."], ["Command Words", "How might \"Looking for Alibrandi\" and \"Go Back to Where You Came From\" be compared in a \"We Are Australians\" essay?", "Both explore who gets to belong in Australia and on what terms - Alibrandi through one individual's generational migrant experience and internal identity struggle, and Go Back to Where You Came From through a confronting, external, documentary examination of asylum seekers and Australian attitudes toward them."], ["Command Words", "What is catharsis and how might it relate to representing human experience?", "The release of strong or repressed emotion, often through engaging with a text - texts representing intense experiences (grief, trauma) can offer readers/viewers a cathartic emotional release."], ["Command Words", "How does juxtaposition help represent contrasting human experiences?", "Placing two contrasting ideas, images or characters side by side highlights their differences, often used to show contrasting responses to the same experience (e.g. hope vs despair)."], ["Command Words", "What is terra nullius and why is it significant to discussions of Australian identity?", "A Latin term meaning \"land belonging to no one\", used to legally justify British colonisation of Australia until overturned by the Mabo decision in 1992 - central to debates about the legitimacy of settlement and Indigenous rights."], ["Command Words", "How might a text critique the concept of the \"Australian dream\"?", "By showing characters excluded from typical markers of the \"dream\" (home ownership, opportunity, equality) due to race, class or migrant status, revealing gaps between national mythology and lived reality."], ["Command Words", "How might sport be used to explore themes of identity and belonging?", "Being part of a sporting team or community can provide a strong sense of belonging and shared identity, while exclusion from sport (due to gender, race, disability) can highlight social barriers to belonging."], ["Command Words", "What does 'identify' mean as an exam command word?", "Recognise and name something clearly - one of the simplest, lowest-mark command words."], ["Command Words", "What does 'describe' mean as an exam command word?", "State the features or characteristics of something, without needing to explain why."], ["Command Words", "What does 'outline' mean as an exam command word?", "Give a brief summary of the main points, without going into full detail."], ["Command Words", "What does 'explain' mean as an exam command word?", "Show cause and effect - make clear why or how something happens, not just what it is."], ["Command Words", "What does 'analyse' mean as an exam command word?", "Break something into its parts, identify how those parts relate to each other, and draw out what this means."], ["Command Words", "What does 'discuss' mean as an exam command word?", "Explore an issue by presenting points for and/or against it."], ["Command Words", "What does 'assess' mean as an exam command word?", "Make a judgement about the value, quality, outcome or importance of something."], ["Command Words", "What does 'evaluate' mean as an exam command word?", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of something."], ["Command Words", "What does 'justify' mean as an exam command word?", "Support an argument or conclusion with reasons and evidence."], ["Command Words", "What does 'compare' mean as an exam command word?", "Show how two or more things are similar."], ["Command Words", "What does 'contrast' mean as an exam command word?", "Show how two or more things are different."], ["Command Words", "What does 'distinguish' mean as an exam command word?", "Identify and explain the differences between two things that might otherwise seem similar."], ["Command Words", "What does 'examine' mean as an exam command word?", "Inquire into something closely and in detail to understand it fully."], ["Command Words", "What does 'define' mean as an exam command word?", "State the precise meaning of a term and identify its essential features."], ["Command Words", "What does 'interpret' mean as an exam command word?", "Draw meaning from information, data or a source rather than just describing it."], ["Command Words", "What does 'account for' mean as an exam command word?", "State reasons for something, or report on why or how it happened."], ["Command Words", "What does 'apply' mean as an exam command word?", "Use knowledge, a formula or a method in a specific situation or scenario."], ["Command Words", "What does 'investigate' mean as an exam command word?", "Plan, inquire into and draw conclusions about a topic."], ["Command Words", "What does 'propose' mean as an exam command word?", "Put forward an idea, argument or suggestion for consideration."], ["Command Words", "What does 'predict' mean as an exam command word?", "Suggest a likely outcome based on the information available."], ["Command Words", "What does adding 'critically' before 'analyse' or 'evaluate' change?", "It asks for an extra degree of depth, rigour, questioning and reflection beyond a standard analyse/evaluate response."], ["Command Words", "Why does it matter which command word an HSC question uses?", "Command words indicate exactly what kind of response is expected and roughly how many marks are available - lower-order words (identify, outline) are usually worth fewer marks than higher-order words (analyse, evaluate), so answering with the wrong depth costs marks even with correct content."], ["Command Words", "What is the general hierarchy of command words from lowest to highest order?", "Roughly: identify/outline -> describe -> explain -> analyse/discuss -> assess/evaluate -> critically analyse/evaluate, with depth and mark value increasing up the hierarchy."], ["Command Words", "What is the difference between 'fair play' and a 'win at all costs' mentality in texts about sport?", "Fair play values honesty, respect for rules and opponents even in defeat; a 'win at all costs' mentality prioritises victory above ethics, often explored in texts through cheating, doping or unsporting conduct."], ["Command Words", "How might a text explore the commercialisation of sport?", "Showing tension between sport's traditional values (skill, teamwork, community) and its transformation into a profit-driven industry - sponsorship, media rights, athlete branding - often critiquing what's lost in the process."], ["Command Words", "How can nostalgia be used in texts representing sport?", "Composers often idealise a 'golden age' of sport (simpler, purer, more community-focused) to critique its modern commercialised or corrupted state, or to explore personal memory and identity."], ["Command Words", "How might a text use sport to explore race and integration?", "Sport is often depicted as an arena where racial barriers are challenged (e.g. a person of colour succeeding despite discrimination), symbolising broader social progress - though texts may also expose ongoing racism within sporting institutions."], ["Command Words", "How might disability and sport (e.g. the Paralympics) be represented in texts?", "Often used to challenge assumptions about ability and human limitation, reframing narratives of adversity as ones of determination and skill rather than pity - though texts may also critique unequal media coverage or funding."], ["Command Words", "What techniques might a composer use in sports commentary or writing to build tension?", "Short, urgent sentences; present tense for immediacy; rhetorical questions; repetition; and escalating word choice ('surges', 'explodes') to mimic the pace and drama of live action."], ["Command Words", "How can the rules of a game act as a metaphor for social rules or norms?", "A game's structure (rules, boundaries, roles) can mirror how society constrains behaviour - breaking the game's rules can symbolise challenging social conventions or authority more broadly."], ["Command Words", "What is a 'motif', and how does it relate to human experience in a text?", "A recurring image, symbol or idea throughout a text that reinforces a central theme - repetition of a motif can emphasise how a particular experience or emotion persists or develops across the narrative."], ["Command Words", "What does 'responder positioning' mean?", "How a composer's choices (perspective, structure, language) guide the audience to feel a certain way about a character or event - e.g. first-person narration often positions responders to sympathise with that character."], ["Command Words", "Why is Texts and Human Experiences described as exploring both the 'individual' and the 'collective'?", "It examines both a single person's unique, personal experience and the shared experiences that connect people across cultures and time - texts often move between the two to show how personal stories reflect universal human concerns."], ["Command Words", "How might irony be used to represent a human experience?", "Irony highlights a gap between expectation and reality (or what's said and what's meant), often used to critique a character's self-deception, society's flaws, or the unpredictability of human life."]], "m": [["General", "What social value does competition in games reinforce?", null, null, null], ["General", "How has Australian national identity changed in recent decades?", null, null, null], ["General", "Which factor MOST affects how communication is interpreted?", null, null, null], ["General", "Why do authors use figurative language like metaphor?", null, null, null], ["General", "In what context is Standard Australian English most appropriately used?", null, null, null], ["General", "What does recognition of Indigenous perspectives contribute to Australian identity?", null, null, null], ["General", "What best describes a 'collective' human experience?", null, null, null], ["General", "What did the 1967 referendum achieve?", null, null, null], ["General", "What does 'sportsmanship' refer to?", null, null, null], ["General", "What generational secret does Josie uncover about Nonna Katia in \"Looking for Alibrandi\"?", null, null, null], ["General", "What is the format of \"Go Back to Where You Came From\"?", null, null, null]], "t": [["Command Words", "Formal English used in professional, academic, and official contexts.", "Standard Australian English", ["Standard Australian English"]], ["Command Words", "A ____ is a seemingly contradictory situation that, on reflection, reveals a truth - e.g.", "paradox", ["paradox"]], ["Command Words", "A term describing the historical omission of Aboriginal and Torres Strait Islander experiences and.", "Great Australian Silence", ["Great Australian Silence"]], ["Command Words", "It describes a society founded through colonisation and ongoing settlement on land already inhabited by.", "settler-colonial", ["settler-colonial"]], ["Command Words", "An SBS reality/documentary series in.", "Go Back to Where You Came From", ["Go Back to Where You Came From"]], ["Command Words", "Recognise and name something clearly - one of the simplest, lowest-mark command words.", "identify", ["identify"]], ["Command Words", "State the features or characteristics of something, without needing to explain why.", "describe", ["describe"]], ["Command Words", "Give a brief summary of the main points, without going into full detail.", "outline", ["outline"]], ["Command Words", "Show cause and effect - make clear why or how something happens, not just what it is.", "explain", ["explain"]], ["Command Words", "Break something into its parts, identify how those parts relate to each other, and draw out what this means.", "analyse", ["analyse"]], ["Command Words", "Explore an issue by presenting points for and/or against it.", "discuss", ["discuss"]], ["Command Words", "Make a judgement about the value, quality, outcome or importance of something.", "assess", ["assess"]], ["Command Words", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of.", "evaluate", ["evaluate"]], ["Command Words", "Support an argument or conclusion with reasons and evidence.", "justify", ["justify"]], ["Command Words", "Show how two or more things are similar.", "compare", ["compare"]], ["Command Words", "Show how two or more things are different.", "contrast", ["contrast"]], ["Command Words", "Identify and explain the differences between two things that might otherwise seem similar.", "distinguish", ["distinguish"]], ["Command Words", "Inquire into something closely and in detail to understand it fully.", "examine", ["examine"]], ["Command Words", "State the precise meaning of a term and identify its essential features.", "define", ["define"]], ["Command Words", "Draw meaning from information, data or a source rather than just describing it.", "interpret", ["interpret"]], ["Command Words", "State reasons for something, or report on why or how it happened.", "account for", ["account for"]], ["Command Words", "Use knowledge, a formula or a method in a specific situation or scenario.", "apply", ["apply"]], ["Command Words", "Plan, inquire into and draw conclusions about a topic.", "investigate", ["investigate"]], ["Command Words", "Put forward an idea, argument or suggestion for consideration.", "propose", ["propose"]], ["Command Words", "Suggest a likely outcome based on the information available.", "predict", ["predict"]], ["Command Words", "How a composer's choices guide the audience to feel a certain way about a character or event - e.g.", "responder positioning", ["responder positioning"]]]}, "Legal Studies": {"c": [["Crime", "What is doli incapax?", "A rebuttable presumption that children aged 10-13 are incapable of criminal intent, unless the prosecution proves the child knew their actions were seriously wrong."], ["Crime", "What is the standard of proof in a criminal trial?", "Beyond reasonable doubt - the highest standard of proof in the legal system, borne by the prosecution."], ["Crime", "What is a transnational crime?", "A crime that crosses national borders, such as drug trafficking, people smuggling, or cybercrime."], ["Crime", "What are the main purposes of punishment/sentencing?", "Retribution, deterrence (specific and general), rehabilitation, incapacitation, and denunciation."], ["Crime", "Define 'mens rea'.", "The 'guilty mind' - the mental element of a crime, referring to the intention or recklessness of the accused at the time of the offence."], ["Crime", "What is 'bail'?", "The release of an accused person before trial, sometimes with conditions, on the promise they will appear in court."], ["Crime", "What is 'diversion' in the criminal justice system?", "Alternatives to formal court proceedings, such as cautions or youth justice conferencing, used especially for young offenders."], ["Human Rights", "Give one argument in favour of a Charter of Rights for Australia.", "It would give human rights greater legal force, clarity and consistency across Australian jurisdictions."], ["Human Rights", "Does Australia have a national Bill or Charter of Rights?", "No - Australia protects human rights through a combination of the Constitution, statute law and common law, rather than a single comprehensive charter."], ["Human Rights", "What makes a right 'universal'?", "It is considered to belong to all people, regardless of nationality, gender, ethnicity, or any other status."], ["Human Rights", "What documents make up the 'International Bill of Rights'?", "The Universal Declaration of Human Rights, the International Covenant on Civil and Political Rights (ICCPR), and the International Covenant on Economic, Social and Cultural Rights (ICESCR)."], ["Human Rights", "Give one argument against a Charter of Rights for Australia.", "It could transfer significant power from elected parliaments to unelected judges."], ["Human Rights", "What is a 'derogation' of rights?", "A temporary suspension of certain human rights by a government, usually during a state of emergency."], ["Family", "What is a Domestic Violence Order (DVO)/AVO used for in a family law context?", "To legally protect a person from violence or harassment by a family member, which can affect parenting and property proceedings."], ["Family", "Name one contemporary issue affecting family law.", "Any one of: the recognition of diverse family forms, the effectiveness of responses to domestic and family violence, or the impact of technology on relocation and shared care disputes."], ["Family", "What is the principal piece of legislation governing family law in Australia?", "The Family Law Act 1975 (Cth), which created the Family Court and introduced no-fault divorce."], ["Family", "What does 'no-fault divorce' mean?", "Neither party needs to prove wrongdoing - the only ground for divorce is 12 months' separation showing the marriage has irretrievably broken down."], ["Family", "What role does the Family Court (now the Federal Circuit and Family Court of Australia) play?", "It hears matters relating to divorce, parenting arrangements, and property division, applying the Family Law Act."], ["Family", "What is a 'parenting order'?", "A court order that sets out arrangements for a child's care, welfare and development after separation."], ["Indigenous Peoples", "What is self-determination in the context of Indigenous rights?", "The right of a people to freely determine their political status and pursue their own economic, social and cultural development."], ["Indigenous Peoples", "What is native title?", "The recognition in Australian law that Aboriginal and Torres Strait Islander peoples have rights and interests in land and waters according to their traditional laws and customs."], ["Indigenous Peoples", "What is the Native Title Act 1993 (Cth)?", "Commonwealth legislation that established a legal framework and process for the recognition and protection of native title following the Mabo decision."], ["Indigenous Peoples", "What is the Uluru Statement from the Heart (2017)?", "A statement calling for a constitutionally enshrined Aboriginal and Torres Strait Islander Voice to Parliament, Treaty, and Truth-telling."], ["Indigenous Peoples", "What issue does the overrepresentation of Aboriginal and Torres Strait Islander peoples in the criminal justice system refer to?", "Aboriginal and Torres Strait Islander peoples are imprisoned and taken into custody at disproportionately high rates compared to the non-Indigenous population."], ["Indigenous Peoples", "What is the 'Stolen Generations'?", "Aboriginal and Torres Strait Islander children forcibly removed from their families under past government policies."], ["Crime", "What is 'actus reus'?", "The physical act or conduct element of a crime - the 'guilty act' that, combined with mens rea (guilty mind), constitutes an offence."], ["Crime", "What powers do police typically have during a criminal investigation?", "Powers to question suspects, conduct searches (with a warrant or in certain circumstances without), arrest, and detain a person for questioning, subject to legal safeguards."], ["Crime", "What is the adversarial system used in Australian criminal trials?", "A system where the prosecution and defence present opposing cases before an independent judge (and often a jury), who decides the outcome, rather than a judge actively investigating the case."], ["Crime", "Name the key personnel in a criminal trial.", "The judge (or magistrate), the jury (in higher courts), the prosecution, the defence, and witnesses."], ["Crime", "List three factors a court considers when sentencing an offender.", "Any three of: the seriousness of the offence, the offender's criminal history, mitigating and aggravating factors, and the impact on the victim."], ["Crime", "How does the criminal justice system typically treat young offenders differently to adults?", "Through a separate Children's Court, a focus on rehabilitation and diversion over punishment, and doli incapax protections for younger children."], ["Crime", "What is 'extradition' in the context of international/transnational crime?", "The formal process by which one country hands over a person accused or convicted of a crime to another country for trial or punishment."], ["Crime", "What role does INTERPOL play in addressing transnational crime?", "It facilitates cooperation and information-sharing between police forces of different countries to help investigate and combat crimes that cross national borders."], ["Crime", "How does the role of police and prosecutorial discretion affect the criminal justice system?", "Discretion allows police and prosecutors to decide whether to charge, caution or divert an offender - this allows flexibility but raises concerns about consistency and potential bias."], ["Crime", "Give an example of law reform in response to changing views on crime.", "Any example such as the introduction of coercive control laws, changes to consent laws in sexual assault cases, or reforms to bail laws in response to public concern."], ["Crime", "How does the law attempt to balance the rights of victims, offenders and society in the criminal justice system?", "Through mechanisms like victim impact statements (victim voice), rights to a fair trial and legal representation (offender rights), and sentencing that aims to protect the community (society)."], ["Human Rights", "What is the Universal Declaration of Human Rights (UDHR)?", "A 1948 United Nations declaration setting out fundamental human rights to be universally protected - it is not legally binding on its own but is highly influential and underpins later binding treaties."], ["Human Rights", "What is the difference between civil/political rights and economic/social/cultural rights?", "Civil and political rights protect individual freedoms (e.g. free speech, fair trial); economic, social and cultural rights relate to wellbeing and living standards (e.g. right to education, health, work)."], ["Human Rights", "What role do NGOs play in promoting and enforcing human rights?", "Organisations like Amnesty International and Human Rights Watch monitor abuses, raise public awareness, lobby governments, and provide evidence used in international human rights processes."], ["Human Rights", "What is a 'treaty body' in the UN human rights system?", "A committee of independent experts that monitors how well countries comply with a specific human rights treaty they have ratified, and can review complaints and issue recommendations."], ["Human Rights", "Why is state sovereignty considered a challenge to enforcing human rights internationally?", "Countries have the right to govern their own internal affairs, which can limit the ability of international bodies to intervene even when human rights abuses occur within that country's borders."], ["Human Rights", "How have human rights developed in response to changing values and ethical standards?", "New rights (e.g. LGBTQ+ rights, rights of people with disabilities, children's rights) have been recognised over time as societal understanding and ethical standards about who deserves protection have evolved."], ["Human Rights", "Give an example of compliance and non-compliance issues in human rights law.", "A country ratifying a human rights treaty (formal compliance) but continuing practices that breach it in reality (non-compliance), such as ongoing detention practices that breach international refugee law obligations."], ["Family", "What is the 'best interests of the child' principle in family law?", "The paramount consideration used by Australian courts when making decisions about children in family law matters, prioritising the child's welfare above the wishes of the parents."], ["Family", "What is alternative dispute resolution (ADR) in family law, and why is it encouraged?", "Processes like mediation and family dispute resolution that help separating parties reach agreement outside of court - encouraged because it's faster, cheaper and less adversarial than litigation, especially where children are involved."], ["Family", "What are examples of changing family structures recognised in Australian law?", "Blended families, single-parent families, same-sex parented families, and families formed through assisted reproductive technology or surrogacy."], ["Family", "What legal recognition exists for same-sex relationships and marriage in Australia?", "Same-sex marriage was legalised nationally in December 2017, following a national postal survey, giving same-sex couples the same legal marriage rights as opposite-sex couples."], ["Family", "Give an example of law reform improving outcomes for family members.", "Reforms such as the introduction of family violence provisions into the Family Law Act, aiming to better protect victims of domestic violence during parenting and property proceedings."], ["Family", "How effective are legal and non-legal responses in addressing domestic violence?", "Legal responses (AVOs, criminal charges) provide protection and consequences, but non-legal responses (counselling, support services, education campaigns) are also needed to address underlying causes and support victims - together they're more effective than either alone."], ["Indigenous Peoples", "What did the Mabo v Queensland (No 2) (1992) decision establish?", "The High Court recognised native title, overturning the legal fiction of 'terra nullius' (land belonging to no one) and acknowledging that Indigenous peoples had pre-existing rights to land."], ["Indigenous Peoples", "What is the difference between native title and land rights?", "Native title is a common law recognition of pre-existing Indigenous rights to land based on traditional connection; land rights are rights to land granted by specific government legislation, which can be broader or different from native title."], ["Indigenous Peoples", "What did the Royal Commission into Aboriginal Deaths in Custody investigate?", "The high number of Aboriginal deaths occurring while in police or prison custody, making recommendations to address the underlying causes of Indigenous overrepresentation in the justice system."], ["Indigenous Peoples", "What debate surrounds constitutional recognition of Indigenous Australians?", "Whether and how the Australian Constitution should formally recognise Aboriginal and Torres Strait Islander peoples as the first peoples of Australia, including proposals like a constitutionally enshrined Voice to Parliament."], ["Indigenous Peoples", "How does the law reflect changing values around reconciliation and self-determination?", "Through developments such as the Mabo decision, native title legislation, and ongoing debate over the Uluru Statement's proposals, reflecting a gradual (though contested and incomplete) shift toward recognising Indigenous rights and self-determination."], ["Indigenous Peoples", "How effective have legal responses been in achieving just outcomes for Indigenous Australians in the criminal justice system?", "Legal responses like native title and anti-discrimination law have provided some recognition and protection, but Indigenous Australians remain significantly overrepresented in the criminal justice system, showing ongoing gaps in achieving full justice."], ["Crime", "What is the difference between summary and indictable offences?", "Summary offences are less serious and heard by a magistrate alone in the Local Court; indictable offences are more serious and can be heard before a judge and jury in a higher court."], ["Crime", "What is the presumption of innocence?", "A fundamental principle that an accused person is considered innocent until proven guilty beyond reasonable doubt, placing the burden of proof on the prosecution."], ["Human Rights", "What is the International Covenant on Civil and Political Rights (ICCPR)?", "A binding UN treaty (1966) that commits ratifying countries to protecting civil and political rights such as freedom of speech, fair trial and freedom from torture."], ["Human Rights", "What is a 'derogation' from human rights obligations?", "A legally permitted, temporary suspension of certain human rights obligations by a state, typically during a declared public emergency, though some rights can never be derogated from."], ["Family", "What is a 'binding financial agreement' in family law?", "A legal agreement (sometimes called a 'prenup') made between parties before, during or after a relationship, setting out how property and finances will be divided if the relationship ends."], ["Family", "What is the difference between a parenting order and a parenting plan?", "A parenting order is legally enforceable and made by a court; a parenting plan is a written agreement between parents that is not legally enforceable but shows their intentions."], ["Indigenous Peoples", "What is the Wik decision (1996) and how does it differ from Mabo?", "The High Court held that native title could coexist with pastoral leases in some circumstances, extending the Mabo principle by clarifying that native title isn't automatically extinguished by other land uses."], ["Indigenous Peoples", "What is 'self-determination' in the context of Indigenous rights?", "The right of a people to freely determine their political status and pursue their own economic, social and cultural development, a key principle in Indigenous rights advocacy."], ["Crime", "What is the difference between statute law and common law?", "Statute law is law made by parliament through legislation (Acts); common law is law developed by judges through court decisions (precedent) over time."], ["Crime", "What is the doctrine of precedent?", "The principle that courts must follow the legal reasoning of previous decisions made by higher courts in the same jurisdiction when the facts of a case are similar."], ["Crime", "What is the NSW court hierarchy, from lowest to highest?", "Local Court -> District Court -> Supreme Court -> Court of Criminal Appeal, with the High Court of Australia sitting above all state courts as the final court of appeal."], ["Human Rights", "What does 'access to justice' mean, and what can limit it?", "The ability of individuals to obtain fair treatment and outcomes through the legal system. It can be limited by cost, complexity of the legal process, lack of legal knowledge, and geographic isolation - Legal Aid exists to help address this."], ["Human Rights", "What is the 'rule of law'?", "The principle that everyone, including government, is subject to and equal before the law, that laws are applied fairly and consistently, and that no one is above the law."], ["Family", "What is the difference between mediation, conciliation and arbitration as forms of dispute resolution?", "Mediation: a neutral third party helps parties reach their own agreement. Conciliation: similar, but the third party can suggest solutions. Arbitration: a third party hears both sides and makes a binding decision, more like a private court process."], ["Crime", "What is a 'strict liability' offence?", "An offence where the prosecution does not need to prove mens rea (guilty mind) - only that the act (actus reus) occurred, such as many driving and parking offences."], ["Crime", "What is 'causation' in criminal law?", "The requirement that the accused's act must have directly caused the criminal result (e.g. the victim's death) for them to be held liable for that outcome."], ["Crime", "Name the main categories of crime recognised in the NSW criminal justice system.", "Offences against the person, offences against the sovereign, economic offences (property/white collar/computer), drug offences, driving offences, public order offences, and preliminary crimes (attempts and conspiracy)."], ["Crime", "What is the difference between an 'attempt' and a 'conspiracy' as preliminary crimes?", "An attempt is taking a substantial step toward committing a crime that is not completed; a conspiracy is an agreement between two or more people to commit a crime, even if it's never carried out."], ["Crime", "What are the four categories of 'parties to a crime'?", "Principal in the first degree (the main perpetrator), principal in the second degree (present and assisting), accessory before the fact (helped plan but wasn't present), and accessory after the fact (helped the offender evade justice afterward)."], ["Crime", "Give an example of an 'offence against the sovereign'.", "Treason (attempting to overthrow the government) or offences relating to terrorism, which are considered crimes against the state itself rather than an individual victim."], ["Command Words", "What does 'identify' mean as an exam command word?", "Recognise and name something clearly - one of the simplest, lowest-mark command words."], ["Command Words", "What does 'describe' mean as an exam command word?", "State the features or characteristics of something, without needing to explain why."], ["Command Words", "What does 'outline' mean as an exam command word?", "Give a brief summary of the main points, without going into full detail."], ["Command Words", "What does 'explain' mean as an exam command word?", "Show cause and effect - make clear why or how something happens, not just what it is."], ["Command Words", "What does 'analyse' mean as an exam command word?", "Break something into its parts, identify how those parts relate to each other, and draw out what this means."], ["Command Words", "What does 'discuss' mean as an exam command word?", "Explore an issue by presenting points for and/or against it."], ["Command Words", "What does 'assess' mean as an exam command word?", "Make a judgement about the value, quality, outcome or importance of something."], ["Command Words", "What does 'evaluate' mean as an exam command word?", "Make a judgement based on specific criteria, weighing evidence to determine the value or effectiveness of something."], ["Command Words", "What does 'justify' mean as an exam command word?", "Support an argument or conclusion with reasons and evidence."], ["Command Words", "What does 'compare' mean as an exam command word?", "Show how two or more things are similar."], ["Command Words", "What does 'contrast' mean as an exam command word?", "Show how two or more things are different."], ["Command Words", "What does 'distinguish' mean as an exam command word?", "Identify and explain the differences between two things that might otherwise seem similar."], ["Command Words", "What does 'examine' mean as an exam command word?", "Inquire into something closely and in detail to understand it fully."], ["Command Words", "What does 'define' mean as an exam command word?", "State the precise meaning of a term and identify its essential features."], ["Command Words", "What does 'interpret' mean as an exam command word?", "Draw meaning from information, data or a source rather than just describing it."], ["Command Words", "What does 'account for' mean as an exam command word?", "State reasons for something, or report on why or how it happened."], ["Command Words", "What does 'apply' mean as an exam command word?", "Use knowledge, a formula or a method in a specific situation or scenario."], ["Command Words", "What does 'investigate' mean as an exam command word?", "Plan, inquire into and draw conclusions about a topic."], ["Command Words", "What does 'propose' mean as an exam command word?", "Put forward an idea, argument or suggestion for consideration."], ["Command Words", "What does 'predict' mean as an exam command word?", "Suggest a likely outcome based on the information available."], ["Command Words", "What does adding 'critically' before 'analyse' or 'evaluate' change?", "It asks for an extra degree of depth, rigour, questioning and reflection beyond a standard analyse/evaluate response."], ["Command Words", "Why does it matter which command word an HSC question uses?", "Command words indicate exactly what kind of response is expected and roughly how many marks are available - lower-order words (identify, outline) are usually worth fewer marks than higher-order words (analyse, evaluate), so answering with the wrong depth costs marks even with correct content."], ["Command Words", "What is the general hierarchy of command words from lowest to highest order?", "Roughly: identify/outline -> describe -> explain -> analyse/discuss -> assess/evaluate -> critically analyse/evaluate, with depth and mark value increasing up the hierarchy."], ["Human Rights", "What are the three 'generations' of human rights?", "First generation: civil and political rights (e.g. free speech, voting). Second generation: economic, social and cultural rights (e.g. education, healthcare). Third generation: collective/solidarity rights (e.g. self-determination, a healthy environment)."], ["Human Rights", "What role does the UN Human Rights Council play in promoting human rights?", "A UN body that monitors and reports on human rights globally, conducts the Universal Periodic Review of member states, and can investigate specific human rights situations."], ["Human Rights", "What is the Universal Periodic Review (UPR)?", "A UN Human Rights Council process where every member state's human rights record is reviewed periodically by other states, encouraging improvement through peer accountability rather than binding enforcement."], ["Human Rights", "What role does the International Criminal Court (ICC) play in enforcing human rights?", "Prosecutes individuals (not states) for the most serious international crimes - genocide, crimes against humanity, war crimes - but relies on state cooperation to arrest and surrender accused persons, limiting its enforcement power."], ["Human Rights", "Give an example of a specific, contemporary human rights issue commonly studied (e.g. refugees/asylum seekers).", "Refugees and asylum seekers: Australia's mandatory detention and offshore processing policies have been criticised as breaching the right to liberty and non-refoulement under international law, despite Australia being a signatory to the Refugee Convention."], ["Family", "How is property divided when a marriage or de facto relationship ends?", "Under the Family Law Act, the court considers each party's financial and non-financial contributions (including as homemaker/parent) and future needs, aiming for a 'just and equitable' division - not necessarily a 50/50 split."], ["Family", "What role does child support play in family law, and which body administers it?", "Child support is a payment from a non-resident parent to help cover a child's living costs after separation. Services Australia (formerly the Child Support Agency) administers and enforces payment under the Child Support (Assessment) Act 1989."], ["Family", "How does the law define marriage in Australia today?", "Under the Marriage Act 1961 (Cth), marriage is the union of two people, to the exclusion of all others, voluntarily entered into for life - amended in 2017 to remove the requirement that the two people be a man and a woman."], ["Family", "How can cultural and religious factors affect family law in Australia?", "Australian law doesn't recognise religious or customary marriages (e.g. Islamic nikah, Aboriginal customary marriage) as legally binding on their own - a separate civil marriage or registration is needed for legal recognition and protection."], ["Family", "What support services exist to help families going through separation?", "Family Relationship Centres (free information and dispute resolution), Legal Aid (legal assistance for those who can't afford a lawyer), and community legal centres."], ["Indigenous Peoples", "What was the significance of the 1967 Referendum?", "It amended the Australian Constitution to include Aboriginal people in the census and allow the Commonwealth to make laws for them - a major symbolic and practical step, though it didn't grant full legal equality on its own."], ["Indigenous Peoples", "What does the Racial Discrimination Act 1975 (Cth) do?", "Makes it unlawful to discriminate against a person based on race, colour, descent, or national/ethnic origin - it was used to challenge the doctrine of terra nullius in the lead-up to Mabo."], ["Indigenous Peoples", "What is the UN Declaration on the Rights of Indigenous Peoples (UNDRIP)?", "A non-binding international declaration setting out minimum standards for the survival, dignity and wellbeing of Indigenous peoples, including self-determination - Australia initially opposed it in 2007 but endorsed it in 2009."], ["Indigenous Peoples", "How does an Indigenous Land Use Agreement (ILUA) differ from a native title claim?", "An ILUA is a voluntary agreement between native title holders and others (e.g. governments, mining companies) about the use of land, offering a flexible alternative to the formal, often lengthy native title claims process."], ["Crime", "Name the main sentencing options available to a court.", "Imprisonment, suspended sentences, community service/correction orders, good behaviour bonds, fines, and dismissal/discharge without penalty - the court chooses based on the offence's seriousness and the offender's circumstances."], ["Human Rights", "What is the Australian Human Rights Commission (AHRC), and what role does it play?", "An independent statutory body that investigates and helps resolve human rights and discrimination complaints in Australia, and promotes awareness through education and public reporting - but it can't make legally binding rulings."], ["Family", "What legally defines a 'de facto relationship' in Australia?", "A couple (including same-sex) living together on a genuine domestic basis, not married - courts consider factors like duration, shared residence, financial interdependence and public presentation as a couple to determine if one exists."], ["Indigenous Peoples", "What was the 'Bringing Them Home' report (1997)?", "A landmark national inquiry report into the forced removal of Aboriginal and Torres Strait Islander children (the Stolen Generations), which recommended a formal apology and reparations - it led to the 2008 National Apology."]], "m": [["Crime", "What is 'mens rea'?", ["The guilty mind, or intent", "The guilty act", "A type of defence", "A court order"], 0, "Mens rea is the mental element of a crime."], ["Crime", "What is doli incapax?", ["Presumption a child can't form criminal intent", "A type of sentence", "A civil law doctrine", "A police power"], 0, "It applies to children aged 10-13, rebuttable by the prosecution."], ["Crime", "What is the standard of proof in a criminal trial?", ["Beyond reasonable doubt", "Balance of probabilities", "Clear and convincing evidence", "Reasonable suspicion"], 0, "This is the highest standard, borne by the prosecution."], ["Human Rights", "Does Australia have a national Charter of Rights?", ["No", "Yes, since 1901", "Yes, since 2000", "Only in NSW"], 0, "Rights are protected via
