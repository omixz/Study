appened.", "account for", ["account for"]], ["Command Words", "Use knowledge, a formula or a method in a specific situation or scenario.", "apply", ["apply"]], ["Command Words", "Plan, inquire into and draw conclusions about a topic.", "investigate", ["investigate"]], ["Command Words", "Put forward an idea, argument or suggestion for consideration.", "propose", ["propose"]], ["Command Words", "Suggest a likely outcome based on the information available.", "predict", ["predict"]]]}, "Business Services": {"c": [["Safety and Wellbeing", "What are the steps in the risk management process?", "Identify hazards, assess the risks, control the risks, then review the controls."], ["Safety and Wellbeing", "What are the main types of workplace hazard?", "Physical, chemical, biological, ergonomic and psychosocial hazards."], ["Safety and Wellbeing", "Who has duties under WHS law?", "Employers (PCBUs), officers, workers and visitors all have duties."], ["Safety and Wellbeing", "What is a worker's main WHS responsibility?", "To take reasonable care of their own and others' safety and follow reasonable instructions."], ["Safety and Wellbeing", "Why must workplace incidents be reported?", "So hazards can be investigated and fixed to prevent it happening again."], ["Safety and Wellbeing", "What should you do in an emergency evacuation?", "Stay calm, follow the evacuation plan, go to the assembly point and wait for a headcount."], ["Safety and Wellbeing", "How can workplace stress be reduced?", "Manage workload, take breaks, talk to a supervisor and use support services."], ["Sustainability", "What are the three parts of the triple bottom line?", "Economic, social and environmental performance."], ["Sustainability", "How can a workplace reduce energy use?", "Turn off equipment, use LED lighting and energy-efficient appliances, and use natural light."], ["Sustainability", "How can a workplace reduce paper use?", "Use digital documents, print double-sided only when needed, and recycle used paper."], ["Sustainability", "Why do businesses adopt sustainable practices?", "To cut costs, meet legal requirements, protect the environment and improve their reputation."], ["Innovation and Technology", "Name ways to keep data secure.", "Strong passwords, two-factor authentication, regular backups, software updates and antivirus software."], ["Innovation and Technology", "How can you spot a phishing email?", "An unexpected sender, urgent tone, spelling mistakes, suspicious links and requests for personal details."], ["Innovation and Technology", "What are the benefits of cloud storage?", "Access from anywhere, easy sharing, automatic backup and scalable storage."], ["Innovation and Technology", "What are the risks of new technology in the workplace?", "Security breaches, job changes, training costs and over-reliance on systems."], ["Innovation and Technology", "When would you use a spreadsheet instead of a word processor?", "To store numbers, calculate with formulas and create charts."], ["Working in the Business Services Industry", "What are the three main types of communication?", "Verbal, non-verbal and written."], ["Working in the Business Services Industry", "How should you handle a customer complaint?", "Listen actively, empathise, resolve it or escalate it, and follow up."], ["Working in the Business Services Industry", "What are the benefits of workplace diversity?", "A wider range of ideas and skills, better understanding of customers, and improved innovation."], ["Working in the Business Services Industry", "What is the purpose of a code of conduct?", "It sets out expected behaviour so staff act ethically and consistently."], ["Working in the Business Services Industry", "How can you prioritise your work?", "Rank tasks by urgency and importance, set deadlines and use a planner or to-do list."], ["Working in the Business Services Industry", "What does a team need to work well?", "Clear roles and goals, open communication, trust and respect."], ["Working in the Business Services Industry", "What are the steps of problem-solving?", "Identify the problem, gather information, generate options, evaluate them, act, then review."], ["Working in the Business Services Industry", "What does the Privacy Act 1988 require of organisations?", "To handle personal information fairly, store it securely and use it only for its stated purpose."], ["Innovation and Technology", "What criteria are used to evaluate proposed solutions?", "Cost, fit for purpose, resource requirements, timeframe and value adding."], ["Innovation and Technology", "What are the steps to implement a solution?", "Gain authority to proceed, prepare an implementation and communication plan, make the change, then evaluate it."], ["Innovation and Technology", "Why do workplaces change or innovate?", "To improve processes, improve existing products or services, or introduce new ones."], ["Innovation and Technology", "What laws and frameworks apply when solving workplace problems?", "Anti-discrimination, confidentiality and privacy, copyright, the Fair Work system and WHS laws."], ["Innovation and Technology", "What should you check about collected data?", "That it suits workplace needs, comes from reliable sources and is accurate."], ["Innovation and Technology", "How can files be classified?", "Alphabetically, alpha-numerically, chronologically, geographically, numerically or by subject."], ["Innovation and Technology", "Where can you get help when software or equipment fails?", "Workplace manuals and vendor guides, online help and technical support."], ["Innovation and Technology", "What are the two forms of data storage locations and types?", "Fixed or portable, and on-site or off-site."], ["Safety and Wellbeing", "What is the difference between a hazard and a risk?", "A hazard can cause harm; risk is the likelihood and consequence of that harm."], ["Safety and Wellbeing", "What is the hierarchy of risk control?", "Eliminate; minimise (substitute, modify, isolate, engineering); then administrative controls, safe work practices and PPE."], ["Safety and Wellbeing", "Which WHS laws apply in NSW?", "The Work Health and Safety Act 2011 (NSW) and the Work Health and Safety Regulation 2017 (NSW)."], ["Safety and Wellbeing", "What are internal sources of WHS information?", "Colleagues, the HSR, WHS induction, the WHS committee and officers, and workplace policies."], ["Safety and Wellbeing", "What are external sources of WHS information?", "Legislation, SafeWork NSW, Safe Work Australia, local councils, unions and professional associations."], ["Safety and Wellbeing", "What are common hazards in a business services workplace?", "Business equipment, electricity and cabling, hazardous materials, human factors, manual handling, the work environment and work practices."], ["Safety and Wellbeing", "How can ergonomics reduce injury?", "Correct equipment placement, good sitting and standing posture, task rotation and adjustable furniture."], ["Safety and Wellbeing", "What are the costs of workplace injury?", "Human, social, economic and organisational."], ["Safety and Wellbeing", "How should you respond to an emergency?", "Seek assistance, use emergency numbers, alarms and exits, and follow the evacuation procedure."], ["Safety and Wellbeing", "What personal factors affect wellbeing?", "Social and emotional, health, economic and cultural factors."], ["Safety and Wellbeing", "What workplace factors affect wellbeing?", "Culture and morale, colleague relationships, job autonomy and progression, and rewards."], ["Safety and Wellbeing", "What are the key features of an EAP?", "Access to counselling, confidentiality, referrals and follow-up, and wellbeing resources."], ["Sustainability", "What are the three principles of sustainability?", "Economic, environmental and social."], ["Sustainability", "What are the benefits of sustainable work practices?", "Meets ethical obligations, complies with laws, helps the environment and builds reputation."], ["Sustainability", "How can resource consumption be measured?", "Document resources, examine supplier invoices, measure usage under different conditions and monitor data."], ["Sustainability", "What types of resources are used in business services?", "Energy, equipment and consumables, human resources and infrastructure."], ["Sustainability", "What are sustainable work strategies?", "Buy sustainable products, maintain equipment, use energy efficiently, use renewable or recyclable resources and manage waste."], ["Working in the Business Services Industry", "What are the types of employment?", "Full-time, part-time, temporary, casual and contract."], ["Working in the Business Services Industry", "What is the difference between an award, an agreement and a contract?", "An award sets industry minimums, a registered agreement is negotiated for a workplace, and a contract is an individual agreement."], ["Working in the Business Services Industry", "What are the steps of the communication cycle?", "The sender encodes and transmits a message, the receiver decodes it and gives feedback."], ["Working in the Business Services Industry", "What factors affect achieving work goals?", "Limits on cost, time and resources, skill gaps, poor communication and unplanned events."], ["Working in the Business Services Industry", "What goes into a personal work plan?", "Clarify instructions, identify tasks and resources, set timeframes and priorities, schedule work and prepare contingencies."], ["Working in the Business Services Industry", "What are the types of feedback?", "Direct and indirect, formal and informal, and personal reflection."], ["Working in the Business Services Industry", "What are the types of bullying and harassment?", "Verbal, physical, psychological and sexual, either direct or indirect."], ["Working in the Business Services Industry", "What are the benefits of workplace diversity and inclusion?", "Attracts talent, boosts creativity, improves satisfaction and financial performance."]], "m": [["Safety and Wellbeing", "Which control is most effective in the hierarchy of control?", ["Eliminating the hazard", "Wearing PPE", "Training staff", "Putting up a sign"], 0, "Elimination removes the hazard entirely."], ["Safety and Wellbeing", "What does PCBU stand for?", ["Person conducting a business or undertaking", "Public company business unit", "Personal claim for business use", "Primary consultant of business uptake"], 0, "The PCBU holds the primary WHS duty."], ["Safety and Wellbeing", "A safety data sheet gives information about:", ["Hazardous chemicals", "Staff rosters", "Fire exits", "Pay rates"], 0, "SDSs cover handling, storage and first aid."], ["Safety and Wellbeing", "Ergonomics aims to:", ["Fit the job and equipment to the worker", "Speed up all tasks", "Reduce staff numbers", "Improve sales"], 0, "It reduces strain and injury."], ["Sustainability", "Which is a renewable energy source?", ["Solar", "Coal", "Natural gas", "Oil"], 0, "Solar replenishes naturally."], ["Innovation and Technology", "Which message is most likely phishing?", ["An urgent email asking you to confirm your bank password via a link", "A meeting invite from your manager", "A newsletter you subscribed to", "A calendar reminder"], 0, "Urgency plus a request for credentials is a red flag."], ["Innovation and Technology", "Two-factor authentication adds:", ["A second proof of identity", "A longer password", "A backup copy", "A firewall"], 0, "For example a password plus a code."], ["Working in the Business Services Industry", "Which Act sets the National Employment Standards?", ["Fair Work Act 2009", "Privacy Act 1988", "Competition and Consumer Act 2010", "Corporations Act 2001"], 0, "The NES apply to all national system employees."], ["Working in the Business Services Industry", "In a priority matrix, which tasks do you do first?", ["Urgent and important", "Not urgent, not important", "Urgent but unimportant", "Important but not urgent"], 0, "Urgent an
